<!-- Side Bar — เมนูตามบทบาทจาก accounts/navigation.py (mockup: MENU ใน shared.js) -->
<!-- มือถือ: พื้นหลังมืดเมื่อเปิดเมนู -->
<div x-cloak x-show="mobileMenuOpen" @click="mobileMenuOpen = false"
     class="md:hidden fixed inset-0 top-14 bg-black/30 z-10"></div>

<nav id="sidebar"
     :class="mobileMenuOpen ? 'block fixed top-14 bottom-0 left-0 z-20 shadow-xl' : 'hidden'"
     class="md:block md:static w-60 shrink-0 bg-white border-r border-gray-200 overflow-y-auto">
    <div class="py-3">
        {% for item in nav_menu %}
        <a href="{{ item.url }}" data-key="{{ item.key }}"
           class="nav-link flex items-center gap-2 px-4 py-2.5 text-sm text-gray-700 hover:bg-blue-50 border-l-4 {% if item.active %}active border-blue-600{% else %}border-transparent{% endif %}"
           {% if item.active %}aria-current="page"{% endif %}>
            <span>{{ item.icon }}</span>
            <span class="flex-1">{{ item.label }}</span>
            {% if item.badge %}
            <span class="min-w-[1.25rem] text-center bg-red-500 text-white text-[11px] font-bold px-1.5 py-0.5 rounded-full">{{ item.badge }}</span>
            {% endif %}
        </a>
        {% endfor %}
    </div>
</nav>
