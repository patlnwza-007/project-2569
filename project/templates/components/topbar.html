<!-- Top Bar — ตาม mockup index.html และ 00_shell_navigation.md หัวข้อ 1 (ไม่มีเมนูสลับบทบาท: ใช้เฉพาะ mockup) -->
<header class="h-14 shrink-0 bg-blue-700 text-white flex items-center justify-between px-4 shadow-sm z-20">
    <div class="flex items-center gap-2">
        {% if nav_menu %}
        <button type="button" @click="mobileMenuOpen = !mobileMenuOpen"
                class="md:hidden -ml-1 mr-1 p-1.5 rounded-lg hover:bg-white/10" aria-label="เปิด/ปิดเมนู">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        {% endif %}
        <a href="{% url 'home' %}" class="flex items-center gap-2">
            <span class="text-xl">📦</span>
            <span class="font-bold tracking-tight">YuemDee</span>
            <span class="hidden md:inline text-blue-200 text-xs font-normal">ระบบยืม-คืนพัสดุออนไลน์</span>
        </a>
    </div>

    {% if user.is_authenticated %}
    <div class="flex items-center gap-3 text-sm">
        <span id="topbar-role" class="hidden sm:inline bg-yellow-400 text-blue-900 text-xs font-bold px-2 py-1 rounded-full">{{ role_label }}</span>
        <span id="topbar-name" class="hidden sm:inline">{{ display_name }}</span>
        {% if switch_roles %}
        <!-- UC-33 Role Switching: แสดงเฉพาะผู้ใช้ที่มีทั้งบทบาทนักศึกษาและเจ้าหน้าที่ -->
        <div class="relative" x-data="{ open: false }" @click.outside="open = false">
            <button type="button" id="role-switch-btn" @click="open = !open"
                    class="bg-blue-600 hover:bg-blue-800 rounded-lg px-2.5 py-1 text-xs font-semibold flex items-center gap-1">
                <span>สลับบทบาท</span> ▾
            </button>
            <div x-cloak x-show="open" id="role-switch-menu"
                 class="absolute right-0 mt-1 w-44 bg-white text-gray-700 rounded-xl shadow-xl border border-gray-200 text-xs overflow-hidden z-50 py-1">
                {% for value, label in switch_roles %}
                <form method="post" action="{% url 'accounts:switch_role' %}">
                    {% csrf_token %}
                    <input type="hidden" name="role" value="{{ value }}">
                    <button type="submit" class="w-full text-left px-3.5 py-2 hover:bg-blue-50 flex items-center gap-2 {% if value == role %}font-bold text-blue-600 bg-blue-50/50{% endif %}">
                        <span>{% if value == 'student' %}🎓{% else %}👷{% endif %}</span> {{ label }}{% if value == role %} (ใช้อยู่){% endif %}
                    </button>
                </form>
                {% endfor %}
            </div>
        </div>
        {% endif %}
        <form method="post" action="{% url 'accounts:logout' %}">
            {% csrf_token %}
            <button type="submit" class="bg-white/10 hover:bg-white/20 rounded-lg px-2 py-1 text-xs">ออกจากระบบ</button>
        </form>
    </div>
    {% endif %}
</header>
