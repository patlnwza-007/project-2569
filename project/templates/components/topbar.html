<!-- Top Navigation Bar Component -->
<header class="sticky top-0 z-40 bg-white border-b border-gray-200 shadow-sm">
    <div class="px-4 sm:px-6 lg:px-8 flex items-center justify-between h-16">
        
        <!-- Left: Hamburger (Mobile) + Logo -->
        <div class="flex items-center space-x-3">
            <button @click="mobileMenuOpen = !mobileMenuOpen" type="button" class="lg:hidden p-2 text-gray-600 hover:text-gray-900 rounded-lg hover:bg-gray-100">
                <i data-lucide="menu" class="w-6 h-6"></i>
            </button>
            
            <a href="/" class="flex items-center space-x-2">
                <div class="w-9 h-9 rounded-xl bg-blue-600 flex items-center justify-center text-white font-bold text-lg shadow-sm">
                    ย
                </div>
                <div class="flex flex-col">
                    <span class="font-bold text-lg tracking-tight text-gray-900 leading-none">YuemDee</span>
                    <span class="text-xs text-gray-500 font-normal">ระบบยืม-คืนพัสดุ </span>
                </div>
            </a>
        </div>

        <!-- Right: Actions (Notification & User Profile) -->
        <div class="flex items-center space-x-3">
            {% if user.is_authenticated %}
                <!-- Notification Bell -->
                <button type="button" class="p-2 text-gray-500 hover:text-gray-700 rounded-full hover:bg-gray-100 relative">
                    <i data-lucide="bell" class="w-5 h-5"></i>
                    <span class="absolute top-1.5 right-1.5 w-2 h-2 bg-red-500 rounded-full"></span>
                </button>

                <!-- Profile Dropdown -->
                <div class="relative" @click.outside="profileDropdownOpen = false">
                    <button @click="profileDropdownOpen = !profileDropdownOpen" class="flex items-center space-x-2 p-1.5 rounded-xl hover:bg-gray-100 transition-colors">
                        <div class="w-8 h-8 rounded-full bg-blue-100 text-blue-700 flex items-center justify-center font-semibold text-sm">
                            {{ user.username|first|upper }}
                        </div>
                        <span class="hidden md:inline-block text-sm font-medium text-gray-700">
                            {{ user.get_full_name|default:user.username }}
                        </span>
                        <i data-lucide="chevron-down" class="w-4 h-4 text-gray-400"></i>
                    </button>

                    <!-- Dropdown Menu -->
                    <div x-show="profileDropdownOpen" 
                         x-transition:enter="transition ease-out duration-100"
                         x-transition:enter-start="opacity-0 scale-95"
                         x-transition:enter-end="opacity-100 scale-100"
                         x-transition:leave="transition ease-in duration-75"
                         x-transition:leave-start="opacity-100 scale-100"
                         x-transition:leave-end="opacity-0 scale-95"
                         class="absolute right-0 mt-2 w-48 bg-white rounded-xl shadow-lg border border-gray-100 py-1 z-50">
                        <div class="px-4 py-2 border-b border-gray-100">
                            <p class="text-xs text-gray-500">เข้าสู่ระบบในชื่อ</p>
                            <p class="text-sm font-semibold text-gray-900 truncate">{{ user.username }}</p>
                        </div>
                        <a href="{% url 'accounts:logout' %}" class="flex items-center px-4 py-2 text-sm text-red-600 hover:bg-red-50">
                            <i data-lucide="log-out" class="w-4 h-4 mr-2"></i>
                            ออกจากระบบ
                        </a>
                    </div>
                </div>
            {% else %}
                <a href="{% url 'accounts:login' %}" class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-semibold rounded-xl text-white bg-blue-600 hover:bg-blue-700 shadow-sm transition-colors">
                    <i data-lucide="log-in" class="w-4 h-4 mr-2"></i>
                    เข้าสู่ระบบ
                </a>
            {% endif %}
        </div>
    </div>
</header>
