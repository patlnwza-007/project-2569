{% extends "base.html" %}

{% block title %}แดชบอร์ด - YuemDee (ยืมดี){% endblock %}

{% block content %}
<div class="space-y-6">
    <!-- Welcome Banner -->
    <div class="bg-white p-6 rounded-2xl border border-gray-200 shadow-sm flex items-center justify-between">
        <div>
            <h1 class="text-2xl font-bold text-gray-900">ยินดีต้อนรับ, {{ user.get_full_name|default:user.username }} </h1>
        </div>
        <span class="px-3 py-1 bg-blue-100 text-blue-700 font-semibold text-xs rounded-full">
            {% if user.is_staff %}เจ้าหน้าที่ (Staff){% else %}นักศึกษา (Student){% endif %}
        </span>
    </div>
    
</div>
{% endblock %}
