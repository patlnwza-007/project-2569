<div>
    <label for="{{ field.id_for_label }}" class="block text-xs font-semibold text-gray-700 mb-1">{{ field.label }}{% if field.field.required %} <span class="text-red-500">*</span>{% endif %}</label>
    {{ field }}
    {% for e in field.errors %}<p class="text-xs text-red-600 mt-1 font-medium">⚠️ {{ e }}</p>{% endfor %}
</div>
