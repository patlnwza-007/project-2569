<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Bai+Jamjuree:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ['Sarabun', 'Thonburi', 'Bai Jamjuree', 'Inter', 'sans-serif'],
          heading: ['Sarabun', 'Thonburi', 'Space Grotesk', 'sans-serif'],
          mono: ['IBM Plex Mono', 'monospace'],
        }
      }
    }
  }
</script>
<style>
  html, body, button, input, select, textarea, div, p, span, h1, h2, h3, h4, h5, h6 {
    font-family: 'Sarabun', 'Thonburi', 'Bai Jamjuree', 'Inter', sans-serif !important;
  }
  .font-mono, code, pre { font-family: 'IBM Plex Mono', monospace !important; }
  .tab.active { border-bottom: 2px solid #2563eb; color: #2563eb; font-weight: 600; }
  html, body { margin: 0; height: 100%; }
</style>
<title>YuemDee · queue-list</title>
</head>
<body class="bg-gray-50" onload="p_queue_list_init()">

<div id="view-queue-list" class="w-full h-full overflow-y-auto p-6">
<div class="max-w-2xl mx-auto">
    <h1 class="text-2xl font-bold text-gray-800 mb-1">คิวของฉัน</h1>
    <p class="text-sm text-gray-500 mb-6">การจองคิวใหม่ทำได้ที่หน้ารายละเอียดสิ่งของ เมื่อสิ่งของถูกยืมหมด</p>
    <div id="p_queue_list_rows" class="space-y-3"></div>
  </div>
</div>

<script src="../shared.js"></script>
<script>
function p_queue_list_init() { notifyParentPage("queue-list"); p_queue_list_render(); }

function p_queue_list_render() {
  const stu = currentUserId();
  const host = document.getElementById("p_queue_list_rows");
  const queue = db("queue").filter(q => q.student_id === stu);

  if (queue.length === 0) {
    host.innerHTML = `<div class="bg-white rounded-2xl border border-dashed border-gray-300 p-10 text-center"><div class="text-4xl mb-2">⏳</div><p class="text-gray-600 font-semibold">คุณไม่ได้อยู่ในคิวใดๆ ขณะนี้</p></div>`;
    return;
  }
  host.innerHTML = queue.map(q => {
    const item = itemById(q.item_id);
    const itemQueue = db("queue").filter(x => q.asset_tag ? (x.asset_tag === q.asset_tag) : (x.item_id === q.item_id));
    const position = itemQueue.findIndex(x => x.id === q.id) + 1;
    const isReady = position === 1 && item && item.qty_available > 0;
    const tagBadge = q.asset_tag ? `<span class="bg-blue-100 text-blue-900 font-mono text-xs px-2 py-0.5 rounded border border-blue-300 font-bold ml-1">🏷️ รหัสชิ้น: ${q.asset_tag}</span>` : "";

    if (isReady) {
      return `<div class="bg-emerald-50 border-2 border-emerald-300 rounded-2xl p-4 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 shadow-sm">
        <div class="flex items-center gap-3">
          <div class="text-3xl">${item?.image || '📦'}</div>
          <div>
            <div class="flex items-center gap-2 mb-0.5">
              <span class="bg-emerald-600 text-white text-[10px] font-bold px-2 py-0.5 rounded-full">🎉 ถึงคิวคุณแล้ว!</span>
              <span class="text-xs text-emerald-800 font-semibold">(มีของพร้อมให้ยืม)</span>
            </div>
            <p class="font-bold text-sm text-gray-900">${item?.name || 'สิ่งของ'} ${tagBadge}</p>
            <p class="text-xs text-emerald-700 mt-0.5">คุณอยู่ลำดับคิวที่ 1 ของพร้อมยืม ยืนยันส่งคำขอยืมได้ทันที</p>
          </div>
        </div>
        <div class="flex items-center gap-2 shrink-0 w-full sm:w-auto">
          <button onclick="p_queue_list_claimBorrow(${q.item_id}, '${q.asset_tag || ''}', ${q.id})" class="flex-1 sm:flex-none bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white text-xs font-bold rounded-xl px-4 py-2.5 shadow-sm transition-all">
            ⚡ ยืนยันยืมของชิ้นนี้เลย →
          </button>
          <button onclick="p_queue_list_leaveQueue(${q.id})" class="bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 text-xs font-semibold rounded-xl px-3 py-2.5">
            สละสิทธิ์
          </button>
        </div>
      </div>`;
    }
    return `<div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-4 flex items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="text-3xl">${item?.image || '📦'}</div>
        <div>
          <p class="font-semibold text-sm text-gray-800">${item?.name || 'สิ่งของ'} ${tagBadge}</p>
          <p class="text-xs text-gray-500">ลำดับคิวของคุณ: <span class="font-mono font-semibold text-blue-700">${position}</span> จากทั้งหมด ${itemQueue.length} คน <span class="text-gray-400 font-normal">(รอผู้ยืมเดิมคืนของ)</span></p>
        </div>
      </div>
      <button onclick="p_queue_list_leaveQueue(${q.id})" class="bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 text-xs font-semibold rounded-lg px-3 py-1.5">ออกจากคิว</button>
    </div>`;
  }).join("");
}

function p_queue_list_claimBorrow(itemId, assetTag, qid) {
  // Clear cart and insert only this claimed queue item with asset_tag
  dbSave("cart", [{ item_id: itemId, asset_tag: assetTag || null, qty: 1 }]);
  // Remove queue entry
  let queue = db("queue");
  queue = queue.filter(q => q.id !== qid);
  dbSave("queue", queue);
  toastBanner("ถึงคิวของคุณแล้ว! กำลังพานำส่งคำขอยืม...");
  setTimeout(() => navigate("request-form"), 500);
}

function p_queue_list_leaveQueue(qid) {
  if (!confirm("ยืนยันออกจากคิวนี้หรือไม่?")) return;
  let queue = db("queue");
  queue = queue.filter(q => q.id !== qid);
  dbSave("queue", queue);
  toastBanner("ออกจากคิวสำเร็จ");
  p_queue_list_render();
}
</script>
</body>
</html>
