<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Bai+Jamjuree:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ['Sarabun', 'Thonburi', 'Bai Jamjuree', 'Inter', 'sans-serif'],
          heading: ['Sarabun', 'Thonburi', 'Space Grotesk', 'sans-serif'],
          mono: ['IBM Plex Mono', 'monospace'],
        }
      }
    }
  }
</script>
<style>
  html, body, button, input, select, textarea, div, p, span, h1, h2, h3, h4, h5, h6 {
    font-family: 'Sarabun', 'Thonburi', 'Bai Jamjuree', 'Inter', sans-serif !important;
  }
  .font-mono, code, pre { font-family: 'IBM Plex Mono', monospace !important; }
  .tab.active { border-bottom: 2px solid #2563eb; color: #2563eb; font-weight: 600; }
  html, body { margin: 0; height: 100%; }
</style>
<title>YuemDee · user-detail</title>
</head>
<body class="bg-gray-50" onload="p_user_detail_init()">

<div id="view-user-detail" class="w-full h-full overflow-y-auto p-6">
<a href="javascript:void(0)" onclick="navigate('user-list')" class="text-sm text-blue-600 underline">← กลับรายชื่อผู้ใช้งาน</a>
  <div id="p_user_detail_content" class="mt-3"></div>
</div>

<script src="../shared.js"></script>
<script>
function p_user_detail_getUser(email) {
      const overrides = db("role_overrides");
      const ov = overrides.find(o => o.email === email && o.active);
      const isWlStudent = db("whitelist_student").includes(email);
      const isWlStaff = db("whitelist_staff").includes(email);
      const stu = db("students").find(s => s.email === email);
      const staff = db("staffs").find(s => s.email === email);
      const defaultRole = isWlStudent ? "student" : (isWlStaff ? "staff" : null);
      return { email, ov, defaultRole, effectiveRole: ov ? ov.role : defaultRole, stu, staff,
        blocked: db("admin_blocked").includes(email) };
    }
    function p_user_detail_init() {
      notifyParentPage("user-detail");
      const email = qparam("email");
      const u = p_user_detail_getUser(email);
      const host = document.getElementById("p_user_detail_content");
      const pendingCount = u.stu ? db("requests").filter(r => r.student_id === u.stu.id && ["PENDING","APPROVED_WAIT_PICKUP"].includes(r.status)).length : 0;
      host.innerHTML = `<table class="text-sm border-collapse mb-4">
        <tr><td class="border px-2 py-1 font-semibold bg-gray-50">อีเมล</td><td class="border px-2 py-1 font-mono">${u.email}</td></tr>
        <tr><td class="border px-2 py-1 font-semibold bg-gray-50">ชื่อ</td><td class="border px-2 py-1">${u.stu ? u.stu.name : (u.staff ? u.staff.name : "(ยังไม่เคยเข้าสู่ระบบ)")}</td></tr>
        <tr><td class="border px-2 py-1 font-semibold bg-gray-50">บทบาทเริ่มต้น (Whitelist)</td><td class="border px-2 py-1">${u.defaultRole === 'student' ? 'นักศึกษา' : u.defaultRole === 'staff' ? 'เจ้าหน้าที่' : '-'}</td></tr>
        <tr><td class="border px-2 py-1 font-semibold bg-gray-50">บทบาทปัจจุบัน</td><td class="border px-2 py-1">${u.effectiveRole === 'student' ? 'นักศึกษา' : 'เจ้าหน้าที่'} ${u.ov ? '<span class="text-xs text-purple-600">(Role Override)</span>' : ''}</td></tr>
        <tr><td class="border px-2 py-1 font-semibold bg-gray-50">สถานะบัญชี</td><td class="border px-2 py-1">${u.blocked ? '🔴 ระงับสิทธิ์การเข้าสู่ระบบ' : '🟢 ปกติ'}</td></tr>
      </table>
      <div class="flex flex-wrap gap-2">
        <a href="javascript:void(0)" onclick="navigate('role-override', {email: '${email}'})" class="bg-purple-600 text-white text-xs font-semibold px-3 py-1.5 rounded">กำหนดบทบาทรายบุคคล (Role Override)</a>
        ${u.blocked ? `<button onclick="p_user_detail_unblockUser('${email}')" class="bg-green-600 text-white text-xs font-semibold px-3 py-1.5 rounded">ปลดบล็อก</button>`
          : `<button onclick="p_user_detail_blockUser('${email}')" class="bg-orange-600 text-white text-xs font-semibold px-3 py-1.5 rounded">ระงับสิทธิ์เข้าสู่ระบบ</button>`}
        <button onclick="p_user_detail_deleteUser('${email}', ${pendingCount})" class="bg-red-600 text-white text-xs font-semibold px-3 py-1.5 rounded">ลบบัญชีถาวร</button>
      </div>`;
    }
    function p_user_detail_blockUser(email) {
      const list = db("admin_blocked"); if (!list.includes(email)) list.push(email); dbSave("admin_blocked", list);
      toastBanner("ระงับสิทธิ์เข้าสู่ระบบสำเร็จ"); p_user_detail_init();
    }
    function p_user_detail_unblockUser(email) {
      let list = db("admin_blocked"); list = list.filter(e => e !== email); dbSave("admin_blocked", list);
      toastBanner("ปลดบล็อกสำเร็จ"); p_user_detail_init();
    }
    function p_user_detail_deleteUser(email, pendingCount) {
      let msg = "ยืนยันการลบบัญชีนี้ออกจากระบบอย่างถาวร?";
      if (pendingCount > 0) msg = `บัญชีนี้มีคำขอยืมค้างอยู่ ${pendingCount} รายการ — ${msg}`;
      if (!confirm(msg)) return;
      if (pendingCount > 0 && !confirm("ยืนยันอีกครั้ง: ต้องการลบทั้งที่มีคำขอค้างอยู่จริงหรือไม่?")) return;
      let wlS = db("whitelist_student").filter(e => e !== email); dbSave("whitelist_student", wlS);
      let wlT = db("whitelist_staff").filter(e => e !== email); dbSave("whitelist_staff", wlT);
      toastBanner("ลบบัญชีสำเร็จ");
      setTimeout(() => navigate("user-list"), 600);
    }
</script>
</body>
</html>
