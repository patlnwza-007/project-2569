<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Bai+Jamjuree:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ['Sarabun', 'Thonburi', 'Bai Jamjuree', 'Inter', 'sans-serif'],
          heading: ['Sarabun', 'Thonburi', 'Space Grotesk', 'sans-serif'],
          mono: ['IBM Plex Mono', 'monospace'],
        }
      }
    }
  }
</script>
<style>
  html, body, button, input, select, textarea, div, p, span, h1, h2, h3, h4, h5, h6 {
    font-family: 'Sarabun', 'Thonburi', 'Bai Jamjuree', 'Inter', sans-serif !important;
  }
  .font-mono, code, pre { font-family: 'IBM Plex Mono', monospace !important; }
  html, body { margin: 0; height: 100%; }

  @keyframes pulse-gold {
    0%, 100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.7); }
    50% { box-shadow: 0 0 0 10px rgba(245, 158, 11, 0); }
  }
  .animate-pulse-gold {
    animation: pulse-gold 2s infinite;
  }
</style>
<title>YuemDee · ตำแหน่งจัดเก็บสิ่งของ</title>
</head>
<body class="bg-gray-50/80" onload="p_position_map_init()">

<div id="view-position-map" class="w-full h-full overflow-y-auto p-4 md:p-6">
  <div class="max-w-6xl mx-auto space-y-6">
    <!-- Top Navigation & Meta -->
    <div class="flex items-center justify-between">
      <div id="p_position_map_back-link"></div>
      <div class="text-xs text-gray-400 font-mono">YuemDee · Storage Directory</div>
    </div>

    <!-- Header Section with Quick Search & Room Tabs -->
    <div class="bg-white rounded-3xl border border-gray-200 shadow-xs p-5 md:p-7 space-y-5">
      <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
        <div>
          <div class="flex items-center gap-2 mb-1">
            <span class="text-2xl">📍</span>
            <h1 class="text-2xl md:text-3xl font-bold text-gray-900">ตำแหน่งจัดเก็บสิ่งของในห้อง</h1>
          </div>
          <p class="text-sm text-gray-500">
            ตรวจสอบตำแหน่งตู้จัดเก็บและชั้นวางในแต่ละห้อง เพื่อความสะดวกรวดเร็วในการเดินไปหยิบของจริง
          </p>
        </div>

        <!-- Quick Search Bar -->
        <div class="w-full md:w-80 relative">
          <label class="block text-xs font-bold text-gray-500 mb-1">🔍 ค้นหาสิ่งของเพื่อชี้เป้าตู้และชั้นวาง:</label>
          <div class="relative">
            <input type="text" id="p_pos_search" oninput="p_position_map_onSearch(this.value)" placeholder="พิมพ์ชื่อสิ่งของ เช่น โปรเจกเตอร์, สาย HDMI..." 
              class="w-full bg-gray-50 border border-gray-300 rounded-xl px-3.5 py-2 text-sm text-gray-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all pr-8" />
            <button onclick="document.getElementById('p_pos_search').value=''; p_position_map_onSearch('');" class="absolute right-2.5 top-2.5 text-gray-400 hover:text-gray-600 text-xs">✕</button>
          </div>
          <div id="p_pos_search_results" class="hidden absolute z-30 w-full bg-white border border-gray-200 rounded-xl shadow-xl mt-1 max-h-60 overflow-y-auto divide-y divide-gray-100"></div>
        </div>
      </div>

      <!-- Room Selection Tabs -->
      <div class="pt-4 border-t border-gray-100">
        <div class="flex items-center justify-between mb-2.5">
          <span class="text-xs font-bold text-gray-400 uppercase tracking-wider">🏢 เลือกห้องที่ต้องการดูตู้จัดเก็บ:</span>
          <span class="text-xs text-gray-400">คลิกเพื่อสลับห้อง</span>
        </div>
        <div id="p_pos_room_tabs" class="grid grid-cols-1 md:grid-cols-3 gap-3"></div>
      </div>
    </div>

    <!-- Highlighted Target Item Banner (when arrived with ?id=... or searched) -->
    <div id="p_pos_wayfinding_card" class="hidden bg-white rounded-3xl border border-gray-200 shadow-xs p-5 md:p-6"></div>

    <!-- All Cabinets & Shelves in this Room (Direct View - No Cabinet Clicking Required) -->
    <div class="space-y-6">
      <div class="flex items-center justify-between">
        <h2 class="text-lg font-bold text-gray-900 flex items-center gap-2">
          <span>🗄️</span> รายการตู้จัดเก็บและชั้นวางในห้องนี้
        </h2>
        <span id="p_pos_cabinets_summary_badge" class="text-xs text-gray-500"></span>
      </div>

      <!-- Container rendering all cabinets and their shelves directly -->
      <div id="p_pos_all_cabinets_container" class="space-y-6"></div>
    </div>
  </div>
</div>

<script src="../shared.js"></script>
<script>
let p_pos_active_room_id = 1;
let p_pos_highlight_item_id = null;

function p_position_map_init() {
  notifyParentPage("position-map");
  const qId = qparam("id") ? Number(qparam("id")) : null;
  p_pos_highlight_item_id = qId;

  // Back link
  document.getElementById("p_position_map_back-link").innerHTML = qId
    ? `<a href="javascript:void(0)" onclick="navigate('item-detail', {id: ${qId}})" class="inline-flex items-center gap-1.5 text-sm font-semibold text-blue-600 hover:text-blue-800 transition-colors">← กลับไปหน้ารายละเอียดสิ่งของ</a>`
    : `<a href="javascript:void(0)" onclick="navigate('item-list')" class="inline-flex items-center gap-1.5 text-sm font-semibold text-blue-600 hover:text-blue-800 transition-colors">← กลับไปหน้ารายการสิ่งของ</a>`;

  // Auto-focus room if an item id was passed
  if (qId) {
    const item = itemById(qId);
    if (item && item.position_id) {
      const pos = positionById(item.position_id);
      if (pos && pos.room_id) {
        p_pos_active_room_id = pos.room_id;
      }
    }
  }

  p_position_map_renderAll();

  // If arrived with an item id, smoothly scroll to its card after render
  if (qId) {
    setTimeout(() => {
      const targetCard = document.getElementById("item-pos-card-" + qId);
      if (targetCard) {
        targetCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    }, 200);
  }
}

function p_position_map_renderAll() {
  p_position_map_renderRoomTabs();
  p_position_map_renderWayfinding();
  p_position_map_renderAllCabinets();
}

// 1. Room Switcher Tabs
function p_position_map_renderRoomTabs() {
  const rooms = db("rooms") || [];
  const host = document.getElementById("p_pos_room_tabs");
  if (!rooms.length) { host.innerHTML = "<p class='text-xs text-gray-400'>ไม่มีข้อมูลห้อง</p>"; return; }

  host.innerHTML = rooms.map(r => {
    const isActive = r.id === p_pos_active_room_id;
    const positionsInRoom = (db("positions") || []).filter(p => p.room_id === r.id);
    const posIds = positionsInRoom.map(p => p.id);
    const itemsCount = (db("items") || []).filter(i => posIds.includes(i.position_id)).length;

    return `
      <button onclick="p_position_map_selectRoom(${r.id})" class="text-left p-3.5 rounded-2xl border transition-all cursor-pointer ${
        isActive 
          ? 'bg-blue-50/90 border-blue-500 shadow-sm ring-2 ring-blue-500/20' 
          : 'bg-white border-gray-200 hover:border-blue-300 hover:bg-gray-50'
      }">
        <div class="flex items-center justify-between gap-2">
          <div class="flex items-center gap-2.5 min-w-0">
            <span class="text-2xl shrink-0">${r.image}</span>
            <div class="min-w-0">
              <div class="flex items-center gap-1.5">
                <span class="font-mono text-[11px] font-bold px-2 py-0.5 rounded ${isActive ? 'bg-blue-600 text-white' : 'bg-gray-100 text-gray-700'}">${r.code}</span>
                <span class="text-xs text-gray-500 truncate">${r.floor}</span>
              </div>
              <h3 class="font-bold text-sm text-gray-900 truncate mt-0.5">${r.name}</h3>
            </div>
          </div>
          <span class="text-xs font-semibold px-2 py-1 rounded-full shrink-0 ${isActive ? 'bg-blue-200/80 text-blue-900 font-bold' : 'bg-gray-100 text-gray-600'}">
            ${itemsCount} สิ่งของ
          </span>
        </div>
      </button>
    `;
  }).join("");
}

function p_position_map_selectRoom(roomId) {
  p_pos_active_room_id = roomId;
  p_position_map_renderAll();
}

// 2. Wayfinding Banner
function p_position_map_renderWayfinding() {
  const host = document.getElementById("p_pos_wayfinding_card");
  const room = roomById(p_pos_active_room_id);

  if (!p_pos_highlight_item_id) {
    host.classList.add("hidden");
    return;
  }

  const item = itemById(p_pos_highlight_item_id);
  if (!item) {
    host.classList.add("hidden");
    return;
  }

  const pos = positionById(item.position_id);
  const isEquip = item.type === "equipment";
  host.classList.remove("hidden");

  host.innerHTML = `
    <div class="space-y-3.5">
      <!-- Target Item Header -->
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 p-3.5 bg-amber-50/90 border border-amber-300 rounded-2xl">
        <div class="flex items-center gap-3 min-w-0">
          <span class="text-3xl shrink-0 p-2 bg-white rounded-xl border border-amber-200 shadow-xs">${item.image}</span>
          <div class="min-w-0">
            <div class="flex items-center gap-2 flex-wrap">
              <span class="text-[11px] font-bold bg-amber-500 text-white px-2 py-0.5 rounded-md flex items-center gap-1">
                <span>📍</span> กำลังนำทางไปยังสิ่งของนี้
              </span>
              <span class="text-xs font-semibold px-2 py-0.5 rounded-md ${isEquip ? 'bg-indigo-100 text-indigo-800' : item.type === 'durable_material' ? 'bg-sky-100 text-sky-800' : 'bg-teal-100 text-teal-800'}">
                ${isEquip ? 'ครุภัณฑ์' : item.type === 'durable_material' ? 'วัสดุคงทน' : 'วัสดุสิ้นเปลือง'}
              </span>
            </div>
            <h3 class="font-bold text-base text-gray-900 mt-1 truncate">${item.name}</h3>
            <p class="text-xs text-gray-600 mt-0.5">
              คงเหลือ: <strong class="text-emerald-700">${item.qty_available}</strong>/${item.qty_total} ${item.unit || 'ชิ้น'}
              ${item.max_borrow_days ? '· ยืมได้สูงสุด ' + item.max_borrow_days + ' วัน' : ''}
            </p>
          </div>
        </div>
        <button onclick="p_position_map_clearHighlight()" class="text-xs font-semibold text-amber-800 hover:text-amber-950 bg-amber-200/70 hover:bg-amber-200 px-3 py-1.5 rounded-xl transition-colors self-start sm:self-center shrink-0">
          ✕ ล้างการชี้เป้า
        </button>
      </div>

      <!-- Concise Path Steps -->
      <div class="p-3.5 bg-slate-50 border border-slate-200 rounded-xl flex flex-col md:flex-row md:items-center justify-between gap-2 text-xs">
        <div class="flex items-center gap-2 flex-wrap text-slate-800">
          <span class="font-bold text-slate-500">📍 พิกัดที่วาง:</span>
          <span class="bg-blue-100 text-blue-900 font-bold px-2 py-0.5 rounded-md">🏢 ${room ? room.building + ' ' + room.floor : ''}</span>
          <span>➔</span>
          <span class="bg-blue-100 text-blue-900 font-bold px-2 py-0.5 rounded-md">🚪 ${room ? room.name + ' (' + room.code + ')' : ''}</span>
          <span>➔</span>
          <span class="bg-amber-200 text-amber-950 font-bold px-2 py-0.5 rounded-md">🗄️ ${pos ? pos.cabinet : '-'}</span>
          <span>➔</span>
          <span class="bg-amber-200 text-amber-950 font-bold px-2 py-0.5 rounded-md">🪜 ${pos ? pos.shelf_name : '-'}</span>
        </div>
        <button onclick="document.getElementById('item-pos-card-${item.id}').scrollIntoView({behavior: 'smooth', block: 'center'})" class="text-xs font-semibold text-blue-600 hover:text-blue-800 self-start md:self-auto shrink-0">
          เลื่อนลงไปยังตำแหน่งของชิ้นนี้ ↓
        </button>
      </div>
    </div>
  `;
}

function p_position_map_clearHighlight() {
  p_pos_highlight_item_id = null;
  p_position_map_renderAll();
}

// 3. Render All Cabinets & Shelves directly (No need to select cabinets)
function p_position_map_renderAllCabinets() {
  const room = roomById(p_pos_active_room_id);
  const host = document.getElementById("p_pos_all_cabinets_container");
  const badge = document.getElementById("p_pos_cabinets_summary_badge");
  if (!room) return;

  const cabinets = room.cabinets || ["ตู้ A1", "ตู้ A2", "ตู้ B1"];
  const allPositions = db("positions") || [];
  const allItems = db("items") || [];

  const roomPositions = allPositions.filter(p => p.room_id === room.id);
  const posIds = roomPositions.map(p => p.id);
  const roomItems = allItems.filter(i => posIds.includes(i.position_id));

  if (badge) {
    badge.innerText = `มีทั้งหมด ${cabinets.length} ตู้จัดเก็บ · ${roomItems.length} รายการสิ่งของ`;
  }

  host.innerHTML = cabinets.map((cabName, cabIdx) => {
    const cabPositions = roomPositions.filter(p => p.cabinet === cabName);
    const cabPosIds = cabPositions.map(p => p.id);
    const cabItems = roomItems.filter(i => cabPosIds.includes(i.position_id));
    const hasTargetItem = cabItems.some(i => i.id === p_pos_highlight_item_id);

    // Standard shelf levels 3, 2, 1 (top to bottom)
    const shelfLevels = [3, 2, 1];

    const shelvesHtml = shelfLevels.map(lvl => {
      const pos = cabPositions.find(p => p.shelf === lvl);
      const shelfTitle = lvl === 3 ? "ชั้นที่ 3 (บนสุด)" : lvl === 2 ? "ชั้นที่ 2 (ชั้นกลาง — ระดับสายตา)" : "ชั้นที่ 1 (ล่างสุด)";
      const shelfItems = pos ? roomItems.filter(i => i.position_id === pos.id) : [];
      const isTargetShelf = shelfItems.some(i => i.id === p_pos_highlight_item_id);

      return `
        <div class="rounded-2xl border-2 transition-all p-4 ${
          isTargetShelf 
            ? 'bg-amber-50/90 border-amber-400 shadow-md ring-2 ring-amber-300' 
            : 'bg-white border-gray-200/90'
        }">
          <!-- Shelf Level Header -->
          <div class="flex items-center justify-between pb-2 mb-3 border-b border-gray-100">
            <div class="flex items-center gap-2">
              <span class="text-base">🪜</span>
              <span class="font-bold text-sm text-gray-800">${shelfTitle}</span>
              ${isTargetShelf ? '<span class="bg-amber-500 text-white font-bold text-[10px] px-2.5 py-0.5 rounded-full animate-bounce">📍 สิ่งของเป้าหมายวางอยู่ที่ชั้นนี้!</span>' : ''}
            </div>
            <span class="text-xs font-mono text-gray-500 font-semibold bg-gray-100 px-2.5 py-0.5 rounded-full">
              ${shelfItems.length} สิ่งของ
            </span>
          </div>

          <!-- Items on this shelf -->
          ${shelfItems.length === 0 ? `
            <div class="py-4 text-center text-xs text-gray-400 border border-dashed border-gray-200 rounded-xl bg-gray-50/50">
              (ชั้นว่าง — ยังไม่มีสิ่งของจัดวางในชั้นนี้)
            </div>
          ` : `
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
              ${shelfItems.map(item => {
                const isItemTarget = item.id === p_pos_highlight_item_id;
                const isEquip = item.type === "equipment";
                return `
                  <div id="item-pos-card-${item.id}" class="p-3.5 rounded-xl border transition-all flex flex-col justify-between gap-3 ${
                    isItemTarget 
                      ? 'bg-amber-100/90 border-amber-400 shadow-md ring-4 ring-amber-300/70 animate-pulse-gold' 
                      : 'bg-gray-50/80 border-gray-200 hover:bg-white hover:border-blue-300 hover:shadow-xs'
                  }">
                    <div class="flex items-start gap-3">
                      <span class="text-3xl shrink-0 p-2 bg-white rounded-xl border border-gray-100 shadow-xs">${item.image}</span>
                      <div class="min-w-0 flex-1">
                        <div class="flex items-center gap-1.5 flex-wrap">
                          <span class="text-[10px] font-semibold px-2 py-0.5 rounded-md ${
                            isEquip ? 'bg-indigo-50 text-indigo-700 border border-indigo-100' : item.type === 'durable_material' ? 'bg-sky-50 text-sky-700 border border-sky-200' : 'bg-teal-50 text-teal-700 border border-teal-100'
                          }">
                            ${isEquip ? 'ครุภัณฑ์' : item.type === 'durable_material' ? 'วัสดุคงทน' : 'วัสดุสิ้นเปลือง'}
                          </span>
                          ${isItemTarget ? '<span class="text-[10px] font-bold text-amber-900 bg-amber-200 px-1.5 py-0.5 rounded">📍 ชิ้นที่คุณหา</span>' : ''}
                        </div>
                        <h4 class="font-bold text-sm text-gray-900 mt-1 truncate">${item.name}</h4>
                        <div class="text-xs text-gray-500 mt-0.5">
                          คงเหลือ: <strong class="${item.qty_available === 0 ? 'text-red-600' : 'text-emerald-700'} font-bold">${item.qty_available}</strong>/${item.qty_total} ${item.unit || 'ชิ้น'}
                        </div>
                      </div>
                    </div>

                    <!-- Action Footer -->
                    <div class="pt-2 border-t border-gray-200/70 flex items-center justify-between">
                      <span class="text-[11px] text-gray-400">
                        ${item.max_borrow_days ? 'ยืมสูงสุด ' + item.max_borrow_days + ' วัน' : 'เบิกใช้งาน'}
                      </span>
                      <a href="javascript:void(0)" onclick="navigate('item-detail', {id: ${item.id}})" 
                        class="px-2.5 py-1 rounded-lg text-xs font-semibold transition-all flex items-center gap-1 ${
                          isItemTarget 
                            ? 'bg-amber-600 hover:bg-amber-700 text-white shadow-xs' 
                            : 'bg-white border border-gray-300 text-gray-700 hover:bg-blue-50 hover:border-blue-300 hover:text-blue-700'
                        }">
                        <span>ดูรายละเอียด</span> →
                      </a>
                    </div>
                  </div>
                `;
              }).join("")}
            </div>
          `}
        </div>
      `;
    }).join("");

    return `
      <div class="bg-white rounded-3xl border-2 transition-all p-5 md:p-6 space-y-4 shadow-xs ${
        hasTargetItem ? 'border-amber-400 ring-2 ring-amber-300/40' : 'border-gray-200'
      }">
        <!-- Cabinet Title Bar -->
        <div class="flex items-center justify-between pb-3 border-b border-gray-100">
          <div class="flex items-center gap-3">
            <span class="text-3xl shrink-0 p-2 bg-slate-100 rounded-2xl border border-slate-200">🗄️</span>
            <div>
              <div class="flex items-center gap-2">
                <h3 class="text-lg font-bold text-gray-900">${cabName}</h3>
                <span class="text-xs font-mono bg-slate-100 text-slate-700 px-2 py-0.5 rounded-md font-semibold">
                  3 ชั้นวาง
                </span>
                ${hasTargetItem ? '<span class="bg-amber-500 text-white font-bold text-[10px] px-2 py-0.5 rounded-md">📍 มีสิ่งของที่คุณค้นหา</span>' : ''}
              </div>
              <p class="text-xs text-gray-500 mt-0.5">
                ประจำห้อง ${room.code} (${room.name}) · ${cabIdx === 0 ? 'โซนฝั่งซ้ายมือ' : cabIdx === 1 ? 'โซนฝั่งซ้าย (ติดผนัง)' : 'โซนฝั่งขวามือ'}
              </p>
            </div>
          </div>
          <span class="text-xs font-bold px-3 py-1 rounded-full ${hasTargetItem ? 'bg-amber-100 text-amber-900' : 'bg-gray-100 text-gray-600'}">
            ${cabItems.length} สิ่งของ
          </span>
        </div>

        <!-- Shelves inside this cabinet -->
        <div class="space-y-3.5">
          ${shelvesHtml}
        </div>
      </div>
    `;
  }).join("");
}

// 5. Quick Search & Jump
function p_position_map_onSearch(val) {
  const resHost = document.getElementById("p_pos_search_results");
  if (!val.trim()) {
    resHost.classList.add("hidden");
    return;
  }
  const q = val.trim().toLowerCase();
  const items = db("items") || [];
  const matches = items.filter(i => i.name.toLowerCase().includes(q));

  if (matches.length === 0) {
    resHost.classList.remove("hidden");
    resHost.innerHTML = `<div class="p-3 text-xs text-gray-400 text-center">ไม่พบสิ่งของที่ค้นหา</div>`;
    return;
  }

  resHost.classList.remove("hidden");
  resHost.innerHTML = matches.slice(0, 6).map(item => {
    const pos = positionById(item.position_id);
    const room = pos ? roomById(pos.room_id) : null;
    return `
      <div onclick="p_position_map_pickSearchResult(${item.id})" class="p-2.5 hover:bg-blue-50 cursor-pointer transition-colors flex items-center justify-between text-xs">
        <div class="flex items-center gap-2 min-w-0">
          <span class="text-lg">${item.image}</span>
          <span class="font-bold text-gray-800 truncate">${item.name}</span>
        </div>
        <div class="text-right text-[11px] text-gray-500 shrink-0 ml-2">
          <span>${room ? room.code : '-'}</span> · <span>${pos ? pos.cabinet : '-'}</span>
        </div>
      </div>
    `;
  }).join("");
}

function p_position_map_pickSearchResult(itemId) {
  document.getElementById("p_pos_search").value = "";
  document.getElementById("p_pos_search_results").classList.add("hidden");
  p_pos_highlight_item_id = itemId;

  const item = itemById(itemId);
  if (item && item.position_id) {
    const pos = positionById(item.position_id);
    if (pos && pos.room_id) {
      p_pos_active_room_id = pos.room_id;
    }
  }

  p_position_map_renderAll();

  // Scroll to the item card
  setTimeout(() => {
    const card = document.getElementById("item-pos-card-" + itemId);
    if (card) {
      card.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  }, 100);
}
</script>
</body>
</html>
