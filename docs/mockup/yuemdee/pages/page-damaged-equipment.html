<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Bai+Jamjuree:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ['Sarabun', 'Thonburi', 'Bai Jamjuree', 'Inter', 'sans-serif'],
          heading: ['Sarabun', 'Thonburi', 'Space Grotesk', 'sans-serif'],
          mono: ['IBM Plex Mono', 'monospace'],
        }
      }
    }
  }
</script>
<style>
  html, body, button, input, select, textarea, div, p, span, h1, h2, h3, h4, h5, h6 {
    font-family: 'Sarabun', 'Thonburi', 'Bai Jamjuree', 'Inter', sans-serif !important;
  }
  .font-mono, code, pre { font-family: 'IBM Plex Mono', monospace !important; }
  html, body { margin: 0; height: 100%; }
</style>
<title>YuemDee · damaged-equipment</title>
</head>
<body class="bg-gray-50" onload="p_damaged_equipment_init()">

<div id="view-damaged-equipment" class="w-full h-full overflow-y-auto p-6">
  <div class="max-w-4xl mx-auto">
    <h1 class="text-2xl font-bold text-gray-800 mb-1">⚠️ ครุภัณฑ์เสียหายและการแจ้งซ่อม</h1>
    <p class="text-sm text-gray-500 mb-5">จัดการรายการครุภัณฑ์ที่เสียหายในคลัง และติดตามเรื่องแจ้งซ่อมอุปกรณ์ประจำห้องเรียน/สถานที่จากนักศึกษา</p>

    <!-- Tabs Navigation -->
    <div class="flex border-b border-gray-200 mb-5 gap-6 text-sm font-semibold">
      <button id="tab_btn_units" onclick="p_damaged_equipment_switchTab('units')" class="pb-3 border-b-2 border-blue-600 text-blue-600 flex items-center gap-2">
        <span>⚠️ ครุภัณฑ์เสียหายในคลัง</span>
        <span id="tab_count_units" class="bg-red-100 text-red-700 text-xs px-2 py-0.5 rounded-full font-bold">0</span>
      </button>
      <button id="tab_btn_reports" onclick="p_damaged_equipment_switchTab('reports')" class="pb-3 border-b-2 border-transparent text-gray-500 hover:text-gray-700 flex items-center gap-2">
        <span>📩 รายการแจ้งชำรุดจากนักศึกษา</span>
        <span id="tab_count_reports" class="bg-blue-100 text-blue-700 text-xs px-2 py-0.5 rounded-full font-bold">0</span>
      </button>
    </div>

    <!-- Section 1: Damaged units in warehouse -->
    <div id="p_damaged_equipment_section_units">
      <div id="p_damaged_equipment_summary" class="mb-3"></div>

      <!-- Toolbar: Sub-filter & Select All -->
      <div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-3 mb-3 flex flex-wrap items-center justify-between gap-3">
        <div class="flex items-center gap-2">
          <button id="subfilter_btn_all" onclick="p_damaged_equipment_setSubfilter('ALL')" class="px-3 py-1.5 rounded-xl text-xs font-bold bg-blue-50 text-blue-700 border border-blue-200">ทั้งหมด</button>
          <button id="subfilter_btn_damaged" onclick="p_damaged_equipment_setSubfilter('DAMAGED')" class="px-3 py-1.5 rounded-xl text-xs font-semibold text-gray-600 hover:bg-gray-50 border border-gray-200">⚠️ รอส่งซ่อม</button>
          <button id="subfilter_btn_maintenance" onclick="p_damaged_equipment_setSubfilter('MAINTENANCE')" class="px-3 py-1.5 rounded-xl text-xs font-semibold text-gray-600 hover:bg-gray-50 border border-gray-200">🛠️ อยู่ระหว่างส่งซ่อม</button>
          <button id="subfilter_btn_retired" onclick="p_damaged_equipment_setSubfilter('RETIRED')" class="px-3 py-1.5 rounded-xl text-xs font-semibold text-gray-600 hover:bg-gray-50 border border-gray-200">📦 ปลดระวาง</button>
        </div>

        <div class="flex items-center gap-2">
          <label class="inline-flex items-center gap-2 text-xs font-semibold text-gray-700 cursor-pointer bg-gray-50 hover:bg-gray-100 border border-gray-200 px-3 py-1.5 rounded-xl transition-all select-none">
            <input type="checkbox" id="p_damaged_check_all" onchange="p_damaged_equipment_toggleSelectAll(this.checked)" class="w-4 h-4 text-blue-600 rounded cursor-pointer">
            <span id="p_damaged_check_all_label">เลือกทั้งหมด</span>
          </label>
        </div>
      </div>

      <!-- Batch Action Floating / Sticky Bar -->
      <div id="p_damaged_batch_bar" class="hidden bg-gradient-to-r from-blue-50 to-indigo-50 border border-blue-200 rounded-2xl p-3.5 mb-4 shadow-sm flex flex-wrap items-center justify-between gap-3 animate-fade-in">
        <div class="flex items-center gap-2">
          <span class="text-xs font-bold text-blue-950 flex items-center gap-1.5">
            <span>✓</span> เลือกแล้ว <span id="p_damaged_selected_count" class="bg-blue-600 text-white text-xs px-2 py-0.5 rounded-full font-bold">0</span> ชิ้น:
          </span>
        </div>
        <div class="flex items-center gap-2">
          <button onclick="p_damaged_equipment_batchSetStatus('MAINTENANCE')" class="bg-amber-600 hover:bg-amber-700 text-white text-xs font-semibold rounded-xl px-3.5 py-2 shadow-sm transition-all flex items-center gap-1.5">
            <span>🛠️</span> ส่งซ่อมที่เลือก
          </button>
          <button onclick="p_damaged_equipment_batchSetStatus('AVAILABLE')" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold rounded-xl px-3.5 py-2 shadow-sm transition-all flex items-center gap-1.5">
            <span>✅</span> ซ่อมเสร็จแล้วที่เลือก
          </button>
          <button onclick="p_damaged_equipment_batchSetStatus('RETIRED')" class="bg-gray-700 hover:bg-gray-800 text-white text-xs font-semibold rounded-xl px-3.5 py-2 shadow-sm transition-all flex items-center gap-1.5">
            <span>📦</span> ปลดระวางที่เลือก
          </button>
          <button onclick="p_damaged_equipment_clearSelection()" class="text-xs text-gray-500 hover:text-gray-700 font-medium px-2 py-1">
            ยกเลิก
          </button>
        </div>
      </div>

      <div id="p_damaged_equipment_rows" class="space-y-3"></div>
    </div>

    <!-- Section 2: Student damage reports -->
    <div id="p_damaged_equipment_section_reports" class="hidden">
      <div id="p_damaged_reports_summary" class="mb-4"></div>
      <div id="p_damaged_reports_rows" class="space-y-3"></div>
    </div>
  </div>
</div>

<script src="../shared.js"></script>
<script>
let currentTab = "units";
let currentSubfilter = "ALL"; // ALL, DAMAGED, MAINTENANCE
let selectedUnits = new Set();

function p_damaged_equipment_init() {
  notifyParentPage("damaged-equipment");
  p_damaged_equipment_render();
}

function p_damaged_equipment_switchTab(tab) {
  currentTab = tab;
  const isUnits = tab === "units";
  document.getElementById("tab_btn_units").className = isUnits 
    ? "pb-3 border-b-2 border-blue-600 text-blue-600 flex items-center gap-2 font-bold"
    : "pb-3 border-b-2 border-transparent text-gray-500 hover:text-gray-700 flex items-center gap-2 font-semibold";
  document.getElementById("tab_btn_reports").className = !isUnits 
    ? "pb-3 border-b-2 border-blue-600 text-blue-600 flex items-center gap-2 font-bold"
    : "pb-3 border-b-2 border-transparent text-gray-500 hover:text-gray-700 flex items-center gap-2 font-semibold";

  document.getElementById("p_damaged_equipment_section_units").classList.toggle("hidden", !isUnits);
  document.getElementById("p_damaged_equipment_section_reports").classList.toggle("hidden", isUnits);
}

function p_damaged_equipment_setSubfilter(filter) {
  currentSubfilter = filter;
  selectedUnits.clear();

  const btnAll = document.getElementById("subfilter_btn_all");
  const btnDamaged = document.getElementById("subfilter_btn_damaged");
  const btnMaint = document.getElementById("subfilter_btn_maintenance");
  const btnRetired = document.getElementById("subfilter_btn_retired");

  if (btnAll) btnAll.className = filter === 'ALL' ? "px-3 py-1.5 rounded-xl text-xs font-bold bg-blue-50 text-blue-700 border border-blue-200" : "px-3 py-1.5 rounded-xl text-xs font-semibold text-gray-600 hover:bg-gray-50 border border-gray-200";
  if (btnDamaged) btnDamaged.className = filter === 'DAMAGED' ? "px-3 py-1.5 rounded-xl text-xs font-bold bg-blue-50 text-blue-700 border border-blue-200" : "px-3 py-1.5 rounded-xl text-xs font-semibold text-gray-600 hover:bg-gray-50 border border-gray-200";
  if (btnMaint) btnMaint.className = filter === 'MAINTENANCE' ? "px-3 py-1.5 rounded-xl text-xs font-bold bg-blue-50 text-blue-700 border border-blue-200" : "px-3 py-1.5 rounded-xl text-xs font-semibold text-gray-600 hover:bg-gray-50 border border-gray-200";
  if (btnRetired) btnRetired.className = filter === 'RETIRED' ? "px-3 py-1.5 rounded-xl text-xs font-bold bg-blue-50 text-blue-700 border border-blue-200" : "px-3 py-1.5 rounded-xl text-xs font-semibold text-gray-600 hover:bg-gray-50 border border-gray-200";

  p_damaged_equipment_render();
}

function p_damaged_equipment_toggleSelect(assetTag, isChecked) {
  if (isChecked) {
    selectedUnits.add(assetTag);
  } else {
    selectedUnits.delete(assetTag);
  }
  p_damaged_equipment_updateBatchBar();
}

function p_damaged_equipment_toggleSelectAll(isChecked) {
  const allUnits = db("units").filter(u => u.status === "DAMAGED" || u.status === "MAINTENANCE" || u.status === "RETIRED");
  let filteredUnits = allUnits;
  if (currentSubfilter === "DAMAGED") filteredUnits = allUnits.filter(u => u.status === "DAMAGED");
  if (currentSubfilter === "MAINTENANCE") filteredUnits = allUnits.filter(u => u.status === "MAINTENANCE");
  if (currentSubfilter === "RETIRED") filteredUnits = allUnits.filter(u => u.status === "RETIRED");

  if (isChecked) {
    filteredUnits.forEach(u => selectedUnits.add(u.asset_tag));
  } else {
    filteredUnits.forEach(u => selectedUnits.delete(u.asset_tag));
  }

  p_damaged_equipment_render();
}

function p_damaged_equipment_clearSelection() {
  selectedUnits.clear();
  p_damaged_equipment_render();
}

function p_damaged_equipment_updateBatchBar() {
  const batchBar = document.getElementById("p_damaged_batch_bar");
  const countBadge = document.getElementById("p_damaged_selected_count");
  const checkAll = document.getElementById("p_damaged_check_all");

  if (countBadge) countBadge.textContent = selectedUnits.size;
  if (batchBar) batchBar.classList.toggle("hidden", selectedUnits.size === 0);

  const allUnits = db("units").filter(u => u.status === "DAMAGED" || u.status === "MAINTENANCE" || u.status === "RETIRED");
  let filteredUnits = allUnits;
  if (currentSubfilter === "DAMAGED") filteredUnits = allUnits.filter(u => u.status === "DAMAGED");
  if (currentSubfilter === "MAINTENANCE") filteredUnits = allUnits.filter(u => u.status === "MAINTENANCE");
  if (currentSubfilter === "RETIRED") filteredUnits = allUnits.filter(u => u.status === "RETIRED");

  if (checkAll) {
    checkAll.checked = filteredUnits.length > 0 && selectedUnits.size >= filteredUnits.length;
  }
}

function p_damaged_equipment_render() {
  const allUnits = db("units").filter(u => u.status === "DAMAGED" || u.status === "MAINTENANCE" || u.status === "RETIRED");
  const damagedCount = allUnits.filter(u => u.status === "DAMAGED").length;
  const maintCount = allUnits.filter(u => u.status === "MAINTENANCE").length;
  const retiredCount = allUnits.filter(u => u.status === "RETIRED").length;

  let units = allUnits;
  if (currentSubfilter === "DAMAGED") units = allUnits.filter(u => u.status === "DAMAGED");
  if (currentSubfilter === "MAINTENANCE") units = allUnits.filter(u => u.status === "MAINTENANCE");
  if (currentSubfilter === "RETIRED") units = allUnits.filter(u => u.status === "RETIRED");

  const reports = db("damage_reports") || [];
  const pendingReports = reports.filter(r => r.status !== "RESOLVED");

  document.getElementById("tab_count_units").textContent = allUnits.length;
  document.getElementById("tab_count_reports").textContent = pendingReports.length;

  // Render Units Tab
  const summaryEl = document.getElementById("p_damaged_equipment_summary");
  const hostUnits = document.getElementById("p_damaged_equipment_rows");

  summaryEl.innerHTML = `<div class="bg-red-50 border border-red-200 text-red-700 rounded-2xl px-4 py-2.5 text-xs font-semibold inline-flex items-center gap-2">
    ⚠️ ครุภัณฑ์ในคลังที่เสียหายหรือปลดระวาง ${allUnits.length} ชิ้น (รอส่งซ่อม ${damagedCount} · กำลังซ่อม ${maintCount} · ปลดระวาง ${retiredCount} ชิ้น)
  </div>`;

  if (units.length === 0) {
    hostUnits.innerHTML = `<div class="bg-white rounded-2xl border border-dashed border-gray-300 p-12 text-center">
      <div class="text-5xl mb-3">✅</div>
      <p class="text-gray-700 font-semibold text-base">ไม่มีครุภัณฑ์ในหมวดนี้</p>
      <p class="text-xs text-gray-400 mt-1">เมื่อตรวจรับคืนแล้วพบของชำรุด หรือเปลี่ยนสถานะเป็น DAMAGED/MAINTENANCE/RETIRED รายการจะแสดงที่นี่</p>
    </div>`;
  } else {
    hostUnits.innerHTML = units.map(u => {
      const item = itemById(u.item_id);
      const pos = item ? positionById(item.position_id) : null;
      const isChecked = selectedUnits.has(u.asset_tag);
      const isDamaged = u.status === "DAMAGED";
      const isMaintenance = u.status === "MAINTENANCE";
      const isRetired = u.status === "RETIRED";

      const statusBadge = isDamaged
        ? `<span class="bg-red-100 text-red-700 px-2.5 py-0.5 rounded-full text-xs font-semibold border border-red-200">⚠️ เสียหาย (รอส่งซ่อม)</span>`
        : isMaintenance
        ? `<span class="bg-amber-100 text-amber-800 px-2.5 py-0.5 rounded-full text-xs font-semibold border border-amber-200">🛠️ อยู่ระหว่างส่งซ่อม</span>`
        : `<span class="bg-gray-100 text-gray-700 px-2.5 py-0.5 rounded-full text-xs font-semibold border border-gray-300">📦 ปลดระวาง</span>`;

      return `<div class="bg-white rounded-2xl border ${isChecked ? 'border-blue-400 ring-2 ring-blue-500/10' : 'border-gray-200'} shadow-sm p-4 hover:shadow-md transition-all">
        <div class="flex items-start justify-between gap-4">
          <div class="flex items-start gap-3 flex-1">
            <div class="pt-1">
              <input type="checkbox" ${isChecked ? 'checked' : ''} onchange="p_damaged_equipment_toggleSelect('${u.asset_tag}', this.checked)" class="w-4 h-4 text-blue-600 rounded cursor-pointer">
            </div>
            <div class="flex-1">
              <div class="flex flex-wrap items-center gap-2 mb-1">
                <span class="text-xl">${item?.image || "📦"}</span>
                <span class="text-sm font-bold text-gray-900">${item?.name || "ไม่พบสิ่งของ"}</span>
                <span class="font-mono text-xs bg-gray-100 text-gray-700 px-1.5 py-0.5 rounded border border-gray-200 font-bold">🏷️ ${u.asset_tag}</span>
                ${statusBadge}
              </div>
              <p class="text-xs text-gray-500">ตำแหน่งจัดเก็บ: ${pos ? pos.name : "-"}</p>
              ${u.note ? `<p class="text-xs text-gray-600 font-medium mt-1.5 bg-gray-50 border border-gray-200 rounded-lg p-2">📝 ${u.note}</p>` : ""}
            </div>
          </div>
          <div class="flex flex-col sm:flex-row gap-2 shrink-0">
            ${isDamaged ? `
              <button onclick="p_damaged_equipment_setStatus('${u.asset_tag}', 'MAINTENANCE')" class="bg-amber-50 hover:bg-amber-100 border border-amber-300 text-amber-700 text-xs font-semibold rounded-xl px-3.5 py-2 transition-colors flex items-center justify-center gap-1">🛠️ ส่งซ่อม</button>
              <button onclick="p_damaged_equipment_setStatus('${u.asset_tag}', 'AVAILABLE')" class="bg-emerald-50 hover:bg-emerald-100 border border-emerald-300 text-emerald-700 text-xs font-semibold rounded-xl px-3.5 py-2 transition-colors font-bold flex items-center justify-center gap-1">✅ ซ่อมเสร็จแล้ว</button>
              <button onclick="p_damaged_equipment_setStatus('${u.asset_tag}', 'RETIRED')" class="bg-gray-100 hover:bg-gray-200 border border-gray-300 text-gray-700 text-xs font-semibold rounded-xl px-3.5 py-2 transition-colors flex items-center justify-center gap-1" title="ไม่ต้องระบุเหตุผล">📦 ปลดระวาง</button>
            ` : isMaintenance ? `
              <button onclick="p_damaged_equipment_setStatus('${u.asset_tag}', 'AVAILABLE')" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold rounded-xl px-4 py-2 transition-colors shadow-sm flex items-center justify-center gap-1">✅ ซ่อมเสร็จแล้ว</button>
              <button onclick="p_damaged_equipment_setStatus('${u.asset_tag}', 'RETIRED')" class="bg-gray-100 hover:bg-gray-200 border border-gray-300 text-gray-700 text-xs font-semibold rounded-xl px-3.5 py-2 transition-colors flex items-center justify-center gap-1" title="ไม่ต้องระบุเหตุผล">📦 ปลดระวาง</button>
            ` : `
              <button onclick="p_damaged_equipment_setStatus('${u.asset_tag}', 'AVAILABLE')" class="bg-blue-50 hover:bg-blue-100 border border-blue-300 text-blue-700 text-xs font-semibold rounded-xl px-3.5 py-2 transition-colors flex items-center justify-center gap-1">↩️ นำกลับมาใช้งาน</button>
            `}
          </div>
        </div>
      </div>`;
    }).join("");
  }

  p_damaged_equipment_updateBatchBar();

  // Render Reports Tab
  const hostReports = document.getElementById("p_damaged_reports_rows");
  const summaryReports = document.getElementById("p_damaged_reports_summary");

  summaryReports.innerHTML = `<div class="bg-blue-50 border border-blue-200 text-blue-800 rounded-2xl px-4 py-2.5 text-xs font-semibold inline-flex items-center gap-2">
    📩 ได้รับเรื่องแจ้งซ่อมจากนักศึกษาทั้งหมด ${reports.length} รายการ (รอดำเนินการ ${pendingReports.length} รายการ)
  </div>`;

  if (reports.length === 0) {
    hostReports.innerHTML = `<div class="bg-white rounded-2xl border border-dashed border-gray-300 p-12 text-center text-gray-400 text-xs">ยังไม่มีรายการแจ้งชำรุดจากนักศึกษา</div>`;
  } else {
    hostReports.innerHTML = reports.map(r => {
      const item = r.equipment_id ? itemById(r.equipment_id) : (r.durable_material_id ? itemById(r.durable_material_id) : null);
      const originLoc = r.origin_location || (item && item.location ? item.location : "ห้องคลัง EN6-101");
      const tagBadge = r.asset_tag
        ? `<span class="bg-blue-100 text-blue-700 font-mono text-xs font-bold px-2 py-0.5 rounded border border-blue-200">🏷️ ${r.asset_tag}</span>`
        : `<span class="bg-amber-100 text-amber-800 text-[11px] font-bold px-2 py-0.5 rounded border border-amber-200">ไม่ทราบรหัสประจำชิ้น</span>`;

      const statusBadge = r.status === "PENDING"
        ? `<span class="bg-amber-100 text-amber-800 text-xs font-semibold px-2.5 py-1 rounded-full border border-amber-200">รอตรวจสอบ</span>`
        : (r.status === "IN_PROGRESS"
          ? `<span class="bg-blue-100 text-blue-800 text-xs font-semibold px-2.5 py-1 rounded-full border border-blue-200">กำลังดำเนินการซ่อม</span>`
          : `<span class="bg-green-100 text-green-800 text-xs font-semibold px-2.5 py-1 rounded-full border border-green-200">ซ่อมเสร็จสิ้น</span>`);

      return `<div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-4 hover:shadow-md transition-all">
        <div class="flex items-start justify-between gap-4">
          <div class="flex-1">
            <div class="flex flex-wrap items-center gap-2 mb-1.5">
              ${tagBadge}
              <span class="text-sm font-bold text-gray-900">${r.item_name}</span>
              ${statusBadge}
            </div>
            <div class="text-xs text-gray-600 space-y-0.5">
              <p>🏠 <b>สถานที่ตั้งเดิม:</b> ${originLoc}</p>
              <p>📍 <b>สถานที่พบชำรุด:</b> <b class="text-blue-700">${r.location}</b></p>
              <p>👤 <b>ผู้แจ้ง:</b> ${r.student_name} (${r.student_id}) · 🕒 ${r.created_at}</p>
            </div>
            
            <div class="bg-gray-50 rounded-xl p-3 text-xs text-gray-700 mt-2 border border-gray-100 flex gap-3">
              ${r.photo ? `<img src="${r.photo}" class="w-16 h-16 object-cover rounded-lg shrink-0 border border-gray-200" alt="รูป" />` : ''}
              <div class="flex-1">
                <p class="font-semibold text-gray-700">อาการชำรุดที่พบ:</p>
                <p class="text-gray-800 mt-0.5">${r.symptom}</p>
              </div>
            </div>
          </div>

          <div class="flex flex-col gap-2 shrink-0">
            ${r.status === "PENDING" ? `
              <button onclick="p_damaged_equipment_actionReport(${r.id}, 'IN_PROGRESS')" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold rounded-xl px-4 py-2 transition-colors shadow-sm">🛠️ รับเรื่อง/ส่งช่าง</button>
            ` : ''}
            ${r.status !== "RESOLVED" ? `
              <button onclick="p_damaged_equipment_actionReport(${r.id}, 'RESOLVED')" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold rounded-xl px-4 py-2 transition-colors shadow-sm font-bold">✅ ปิดงานซ่อม</button>
            ` : '<span class="text-xs text-gray-400 text-center py-2">ปิดงานแล้ว</span>'}
          </div>
        </div>
      </div>`;
    }).join("");
  }
}

function p_damaged_equipment_setStatus(assetTag, newStatus) {
  const label = newStatus === "MAINTENANCE" ? "ส่งซ่อม" : (newStatus === "RETIRED" ? "ปลดระวาง" : "ซ่อมเสร็จแล้ว (พร้อมใช้งาน)");
  if (!confirm(`ยืนยันเปลี่ยนสถานะรหัส ${assetTag} เป็น "${label}"?`)) return;

  const units = db("units");
  const u = units.find(x => x.asset_tag === assetTag);
  if (!u) return;
  u.status = newStatus;
  if (newStatus === "AVAILABLE") u.note = "";
  dbSave("units", units);

  const items = db("items");
  const item = items.find(i => i.id === u.item_id);
  if (item) {
    const availUnits = units.filter(x => x.item_id === item.id && x.status === "AVAILABLE").length;
    item.qty_available = availUnits;
    item.base_status = availUnits === 0 && item.qty_total > 0 ? "ไม่พร้อมใช้งาน" : "พร้อมให้ยืม";
    dbSave("items", items);
  }

  selectedUnits.delete(assetTag);
  toastBanner(`อัปเดตสถานะรหัส ${assetTag} เป็น "${label}" สำเร็จ`);
  p_damaged_equipment_render();
}

function p_damaged_equipment_batchSetStatus(newStatus) {
  if (selectedUnits.size === 0) return;
  const label = newStatus === "MAINTENANCE" ? "ส่งซ่อม" : (newStatus === "RETIRED" ? "ปลดระวาง" : "ซ่อมเสร็จแล้ว (พร้อมใช้งาน)");
  const count = selectedUnits.size;
  if (!confirm(`ยืนยันเปลี่ยนสถานะครุภัณฑ์ที่เลือกทั้งหมด ${count} ชิ้น เป็น "${label}"?`)) return;

  const units = db("units");
  const items = db("items");
  const affectedItemIds = new Set();

  selectedUnits.forEach(assetTag => {
    const u = units.find(x => x.asset_tag === assetTag);
    if (u) {
      u.status = newStatus;
      if (newStatus === "AVAILABLE") u.note = "";
      affectedItemIds.add(u.item_id);
    }
  });

  dbSave("units", units);

  affectedItemIds.forEach(itemId => {
    const item = items.find(i => i.id === itemId);
    if (item) {
      const availUnits = units.filter(x => x.item_id === itemId && x.status === "AVAILABLE").length;
      item.qty_available = availUnits;
      item.base_status = availUnits === 0 && item.qty_total > 0 ? "ไม่พร้อมใช้งาน" : "พร้อมให้ยืม";
    }
  });

  dbSave("items", items);

  toastBanner(`อัปเดตสถานะครุภัณฑ์ ${count} ชิ้น เป็น "${label}" สำเร็จ`, "success");
  selectedUnits.clear();
  p_damaged_equipment_render();
}

function p_damaged_equipment_actionReport(id, newStatus) {
  const reports = db("damage_reports") || [];
  const r = reports.find(x => x.id === id);
  if (!r) return;

  r.status = newStatus;
  if (newStatus === "IN_PROGRESS") {
    toastBanner("รับเรื่องและเปลี่ยนสถานะเป็นกำลังดำเนินการซ่อมเรียบร้อยแล้ว");
  } else if (newStatus === "RESOLVED") {
    toastBanner("ปิดงานซ่อมเรียบร้อยแล้ว");
  }

  dbSave("damage_reports", reports);
  p_damaged_equipment_render();
}
</script>
