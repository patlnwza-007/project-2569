<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Bai+Jamjuree:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ['Sarabun', 'Thonburi', 'Bai Jamjuree', 'Inter', 'sans-serif'],
          heading: ['Sarabun', 'Thonburi', 'Space Grotesk', 'sans-serif'],
          mono: ['IBM Plex Mono', 'monospace'],
        }
      }
    }
  }
</script>
<style>
  html, body, button, input, select, textarea, div, p, span, h1, h2, h3, h4, h5, h6 {
    font-family: 'Sarabun', 'Thonburi', 'Bai Jamjuree', 'Inter', sans-serif !important;
  }
  .font-mono, code, pre { font-family: 'IBM Plex Mono', monospace !important; }
  .tab.active { border-bottom: 2px solid #2563eb; color: #2563eb; font-weight: 600; }
  html, body { margin: 0; height: 100%; }
</style>
<title>YuemDee · item-form</title>
</head>
<body class="bg-gray-50" onload="p_item_form_init()">

<div id="view-item-form" class="w-full h-full overflow-y-auto p-6">
<div class="max-w-xl mx-auto">
    <a href="javascript:void(0)" onclick="navigate('item-overview')" class="text-sm text-blue-600 hover:underline">← กลับภาพรวมคลัง</a>
    <h1 id="p_item_form_title" class="text-2xl font-bold text-gray-800 mt-2 mb-1">เพิ่มสิ่งของใหม่</h1>
    <p class="text-sm text-gray-500 mb-6">กำหนดรายละเอียดสิ่งของ หมวดหมู่ และตำแหน่งจัดเก็บในคลังโดยตรง</p>
    <div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-6 space-y-4">
      <div><label class="text-sm font-semibold text-gray-700">ชื่อสิ่งของ <span class="text-red-500">*</span></label>
        <input id="p_item_form_f-name" class="w-full mt-1 border border-gray-300 rounded-lg px-3 py-2 text-sm"></div>
      <div><label class="text-sm font-semibold text-gray-700">รูปภาพ (emoji แทนรูปถ่ายจริงในสาธิต)</label>
        <input id="p_item_form_f-image" placeholder="📦" class="w-full mt-1 border border-gray-300 rounded-lg px-3 py-2 text-sm"></div>
      <div><label class="text-sm font-semibold text-gray-700">ตำแหน่งจัดเก็บ (location) <span class="text-red-500">*</span></label>
        <input id="p_item_form_f-loc" placeholder="เช่น ห้อง EN6-101 · ตู้ A1 ชั้น 2" class="w-full mt-1 border border-gray-300 rounded-lg px-3 py-2 text-sm"></div>

      <div class="grid grid-cols-2 gap-3">
        <div><label class="text-sm font-semibold text-gray-700">จำนวนทั้งหมด <span class="text-red-500">*</span></label>
          <input id="p_item_form_f-qty" type="number" min="1" oninput="p_item_form_renderUnitInputs()" class="w-full mt-1 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300">
        </div>
        <div><label class="text-sm font-semibold text-gray-700">หน่วยนับ (เช่น เครื่อง, ตัว, รีม, แพ็ค) <span class="text-red-500">*</span></label>
          <input id="p_item_form_f-unit" placeholder="เช่น เครื่อง, ชิ้น, รีม" class="w-full mt-1 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300">
        </div>
      </div>

      <div><label class="text-sm font-semibold text-gray-700">ราคาจัดซื้อเดิม (บาท)</label>
        <input id="p_item_form_f-price" type="number" min="0" placeholder="เช่น 25000" class="w-full mt-1 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300">
      </div>

      <!-- Max borrow days & Fine rate per day for Equipment and Durable Material -->
      <div id="p_item_form_days-field" class="grid grid-cols-2 gap-3">
        <div>
          <label class="text-sm font-semibold text-gray-700">จำนวนวันสูงสุดที่ยืมได้</label>
          <input id="p_item_form_f-days" type="number" min="1" class="w-full mt-1 border border-gray-300 rounded-lg px-3 py-2 text-sm">
        </div>
        <div>
          <label class="text-sm font-semibold text-gray-700">อัตราค่าปรับล่าช้า (บาท/วัน)</label>
          <input id="p_item_form_f-fine" type="number" min="0" placeholder="เช่น 20" class="w-full mt-1 border border-gray-300 rounded-lg px-3 py-2 text-sm">
        </div>
      </div>

      <!-- Description field -->
      <div><label class="text-sm font-semibold text-gray-700">รายละเอียด / หมายเหตุสภาพสิ่งของ (description)</label>
        <textarea id="p_item_form_f-desc" rows="2" placeholder="ระบุรายละเอียด การใช้งาน หรือหมายเหตุสภาพสิ่งของ..." class="w-full mt-1 border border-gray-300 rounded-lg px-3 py-2 text-sm"></textarea>
      </div>

      <!-- Asset Tags Input Box for Equipment -->
      <div id="p_item_form_units-box" class="hidden bg-gray-50 border border-blue-200 rounded-2xl p-4 space-y-3">
        <div>
          <h3 class="text-xs font-bold text-blue-900 flex items-center gap-1">
            <span>🏷️</span> รหัสครุภัณฑ์รายชิ้น (Asset Tags / Serial No.)
          </h3>
          <p class="text-[11px] text-gray-500">ระบุรหัสประจำชิ้นสำหรับครุภัณฑ์แต่ละชิ้น (เจ้าหน้าที่เป็นผู้กรอกข้อมูล)</p>
        </div>
        <div id="p_item_form_units-list" class="space-y-2 max-h-48 overflow-y-auto pr-1"></div>
      </div>

      <p id="p_item_form_err" class="hidden text-xs text-red-600 font-medium">⚠️ กรุณากรอกข้อมูลบังคับและรหัสครุภัณฑ์ให้ครบถ้วนก่อนบันทึก</p>
      <button onclick="p_item_form_save()" class="bg-blue-600 hover:bg-blue-700 active:scale-[0.98] text-white text-sm font-semibold rounded-xl px-6 py-2.5 shadow-sm transition-all">บันทึกสิ่งของ</button>
    </div>
  </div>
</div>

<script src="../shared.js"></script>
<script>
let editId = null;

function p_item_form_init() {
  notifyParentPage("item-form");
  editId = null;

  const id = qparam("id");
  if (id) {
    editId = Number(id);
    const item = itemById(editId);
    if (item) {
      const pos = positionById(item.position_id);
      document.getElementById("p_item_form_title").textContent = "แก้ไขสิ่งของ";
      document.getElementById("p_item_form_f-name").value = item.name;
      document.getElementById("p_item_form_f-image").value = item.image;
      document.getElementById("p_item_form_f-loc").value = item.location || (pos ? pos.name : "");
      document.getElementById("p_item_form_f-qty").value = item.qty_total;
      document.getElementById("p_item_form_f-unit").value = item.unit || "ชิ้น";
      document.getElementById("p_item_form_f-price").value = item.price || "";
      document.getElementById("p_item_form_f-days").value = item.max_borrow_days || "";
      document.getElementById("p_item_form_f-fine").value = item.fine_rate_per_day !== undefined && item.fine_rate_per_day !== null ? item.fine_rate_per_day : 20;
      document.getElementById("p_item_form_f-desc").value = item.description || "";
    }
  } else {
    document.getElementById("p_item_form_title").textContent = "เพิ่มสิ่งของใหม่";
    document.getElementById("p_item_form_f-name").value = "";
    document.getElementById("p_item_form_f-image").value = "";
    document.getElementById("p_item_form_f-loc").value = "ห้อง EN6-101 · ตู้ A1 ชั้น 1";
    document.getElementById("p_item_form_f-qty").value = "1";
    document.getElementById("p_item_form_f-unit").value = "ชิ้น";
    document.getElementById("p_item_form_f-price").value = "";
    document.getElementById("p_item_form_f-days").value = "7";
    document.getElementById("p_item_form_f-fine").value = "20";
    document.getElementById("p_item_form_f-desc").value = "";
  }

  p_item_form_toggleUnitsBox();
}

function p_item_form_toggleUnitsBox() {
  const showUnitsBox = !editId;
  const unitsBox = document.getElementById("p_item_form_units-box");
  if (unitsBox) unitsBox.classList.toggle("hidden", !showUnitsBox);
  if (showUnitsBox) p_item_form_renderUnitInputs();

  // In edit mode for equipment, quantity is locked to registered units
  const qtyInput = document.getElementById("p_item_form_f-qty");
  const isEquip = editId ? (db("units").some(u => u.item_id === editId)) : false;
  if (editId && isEquip) {
    qtyInput.readOnly = true;
    qtyInput.classList.add("bg-gray-100", "cursor-not-allowed");
    qtyInput.title = "จำนวนของครุภัณฑ์ขึ้นอยู่กับรหัสประจำชิ้นที่มีอยู่ในระบบ";
  } else {
    qtyInput.readOnly = false;
    qtyInput.classList.remove("bg-gray-100", "cursor-not-allowed");
    qtyInput.title = "";
  }
}

function p_item_form_renderUnitInputs() {
  if (editId) return;

  const qty = Math.max(1, Math.min(50, Number(document.getElementById("p_item_form_f-qty").value) || 1));
  const listEl = document.getElementById("p_item_form_units-list");
  if (!listEl) return;

  let html = "";
  for (let i = 0; i < qty; i++) {
    html += `<div class="flex items-center gap-2 text-xs">
      <span class="text-gray-500 font-medium w-16 text-right shrink-0">ชิ้นที่ ${i + 1}:</span>
      <input type="text" class="unit-tag-input border border-gray-300 rounded-lg px-2.5 py-1.5 font-mono text-xs w-full bg-white focus:outline-none focus:ring-2 focus:ring-blue-300" placeholder="ระบุรหัสครุภัณฑ์ (ถ้ามี) เช่น UBU-EQ-001-${String(i + 1).padStart(2, "0")}">
    </div>`;
  }

  listEl.innerHTML = html;
}

function p_item_form_save() {
  const name = document.getElementById("p_item_form_f-name").value.trim();
  const loc = document.getElementById("p_item_form_f-loc").value.trim();
  const qty = Number(document.getElementById("p_item_form_f-qty").value);
  const errEl = document.getElementById("p_item_form_err");

  if (!name || !loc || isNaN(qty) || qty <= 0) {
    errEl.textContent = "⚠️ กรุณากรอกข้อมูลบังคับให้ครบถ้วนก่อนบันทึก";
    errEl.classList.remove("hidden");
    return;
  }

  // Check tag inputs on create
  const tagInputs = !editId ? document.querySelectorAll(".unit-tag-input") : [];
  const enteredTags = [];
  let hasDuplicate = false;

  tagInputs.forEach(input => {
    const val = input.value.trim();
    if (val) {
      if (enteredTags.includes(val)) {
        hasDuplicate = true;
      } else {
        enteredTags.push(val);
      }
    }
  });

  if (hasDuplicate) {
    errEl.textContent = "⚠️ มีรหัสครุภัณฑ์ซ้ำกัน กรุณาตรวจสอบให้รหัสแต่ละชิ้นไม่ซ้ำกัน";
    errEl.classList.remove("hidden");
    return;
  }

  errEl.classList.add("hidden");

  const items = db("items");
  const fineVal = Number(document.getElementById("p_item_form_f-fine").value);
  const daysVal = Number(document.getElementById("p_item_form_f-days").value);

  // Determine item type for underlying storage
  let inferredType = "durable_material";
  if (enteredTags.length > 0) inferredType = "equipment";
  else if (!daysVal || daysVal <= 0) inferredType = "material";

  const data = {
    name,
    image: document.getElementById("p_item_form_f-image").value.trim() || "📦",
    location: loc,
    unit: document.getElementById("p_item_form_f-unit").value.trim() || "ชิ้น",
    price: Number(document.getElementById("p_item_form_f-price").value) || 0,
    purchase_price: Number(document.getElementById("p_item_form_f-price").value) || 0,
    max_borrow_days: !isNaN(daysVal) && daysVal > 0 ? daysVal : null,
    fine_rate_per_day: !isNaN(fineVal) && fineVal >= 0 ? fineVal : 20,
    description: document.getElementById("p_item_form_f-desc").value.trim(),
    base_status: "พร้อมให้ยืม",
  };

  let targetItemId = editId;

  if (editId) {
    const item = items.find(i => i.id === editId);
    if (item) {
      if (item.type !== "equipment") {
        const diff = qty - item.qty_total;
        item.qty_total = qty;
        item.qty_available = Math.max(0, item.qty_available + diff);
      }
      Object.assign(item, data);
    }
  } else {
    targetItemId = nextId(items);
    items.push({ id: targetItemId, type: inferredType, qty_total: qty, qty_available: qty, ...data });
  }

  dbSave("items", items);

  // Save tags if provided on create
  if (!editId && enteredTags.length > 0) {
    const units = db("units");
    enteredTags.forEach(tag => {
      units.push({
        asset_tag: tag,
        item_id: targetItemId,
        status: "AVAILABLE",
        note: ""
      });
    });
    dbSave("units", units);
  }

  toastBanner("บันทึกข้อมูลสิ่งของเรียบร้อยแล้ว");
  setTimeout(() => navigate("item-overview"), 600);
}
</script>
</body>
</html>
