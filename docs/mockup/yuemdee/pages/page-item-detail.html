<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Bai+Jamjuree:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ['Sarabun', 'Thonburi', 'Bai Jamjuree', 'Inter', 'sans-serif'],
          heading: ['Sarabun', 'Thonburi', 'Space Grotesk', 'sans-serif'],
          mono: ['IBM Plex Mono', 'monospace'],
        }
      }
    }
  }
</script>
<style>
  html, body, button, input, select, textarea, div, p, span, h1, h2, h3, h4, h5, h6 {
    font-family: 'Sarabun', 'Thonburi', 'Bai Jamjuree', 'Inter', sans-serif !important;
  }
  .font-mono, code, pre { font-family: 'IBM Plex Mono', monospace !important; }
  .tab.active { border-bottom: 2px solid #2563eb; color: #2563eb; font-weight: 600; }
  html, body { margin: 0; height: 100%; }
</style>
<title>YuemDee · item-detail</title>
</head>
<body class="bg-gray-50" onload="p_item_detail_init()">

<div id="view-item-detail" class="w-full h-full overflow-y-auto p-6">
<div class="max-w-2xl mx-auto">
    <a href="javascript:void(0)" onclick="navigate('item-list')" class="text-sm text-blue-600 hover:underline">← กลับไปรายการสิ่งของ</a>
    <div id="p_item_detail_content" class="mt-3"></div>
  </div>
</div>

<script src="../shared.js"></script>
<script>
function p_item_detail_init() {
      notifyParentPage("item-detail");
      const id = Number(qparam("id"));
      const item = itemById(id);
      const host = document.getElementById("p_item_detail_content");
      if (!item) {
        host.innerHTML = `<div class="bg-white rounded-2xl border border-gray-200 p-10 text-center mt-3">
          <div class="text-4xl mb-2">❓</div><p class="text-gray-600 font-semibold">ไม่พบสิ่งของนี้</p>
          <p class="text-xs text-gray-400 mt-1">สิ่งของนี้อาจถูกลบหรือปลดระวางไปแล้ว</p></div>`;
        return;
      }
      const cat = categoryById(item.category_id);
      const pos = positionById(item.position_id);
      const unavailable = item.base_status !== "พร้อมให้ยืม";
      const empty = !unavailable && item.qty_available === 0;
      const queue = db("queue").filter(q => q.item_id === id);
      const myPos = queue.findIndex(q => q.student_id === currentUserId()) + 1;
      const units = getUnitsByItemId(id);

      let unitsHtml = "";
      if (item.type === "equipment" && units.length > 0) {
        unitsHtml = `<div class="mt-6 border-t border-gray-200 pt-5">
          <div class="flex items-center justify-between mb-3">
            <h3 class="text-md font-bold text-gray-800 flex items-center gap-2">
              <span>🏷️ รายการรหัสครุภัณฑ์รายชิ้น</span>
              <span class="text-xs font-normal text-red-600 bg-red-50 border border-red-200 px-2 py-0.5 rounded-full">* บังคับเลือกรหัสชิ้นที่ต้องการยืม</span>
            </h3>
          </div>
          <p class="text-xs text-gray-500 mb-4">โปรดตรวจสอบคะแนนดาว สภาพ และรีวิวจากผู้ใช้งานก่อนหน้า แล้วกดปุ่ม <strong>"+ เลือกชิ้นนี้ลงตะกร้า"</strong> ตรงรหัสที่ต้องการ</p>
          <div class="space-y-3">`;
        units.forEach(u => {
          const isAvail = u.status === "AVAILABLE";
          const ratingStars = u.rating ? "⭐".repeat(u.rating) : "ยังไม่มีรีวิว";
          const reviewCount = u.reviews ? u.reviews.length : 0;
          
          let reviewList = "";
          let toggleBtn = "";
          if (u.reviews && u.reviews.length > 0) {
            toggleBtn = `<button onclick="p_item_detail_toggleReviews('${u.asset_tag}')" class="ml-2 inline-flex items-center gap-1 text-xs text-blue-600 hover:text-blue-800 font-semibold bg-blue-50 hover:bg-blue-100 px-2.5 py-0.5 rounded-lg border border-blue-200 transition-all cursor-pointer">💬 ดูรีวิว (${reviewCount})</button>`;
            reviewList = `<div id="reviews-${u.asset_tag}" class="hidden mt-3 text-xs bg-amber-50/60 rounded-xl p-3 space-y-2 border border-amber-200/70">
              <span class="font-bold text-amber-900 block text-[11px]">💬 รีวิวจากผู้ยืมคนก่อนหน้า (${reviewCount} รายการ):</span>`;
            u.reviews.forEach(r => {
              reviewList += `<div class="bg-white rounded-lg p-2.5 border border-amber-200/80 shadow-xs">
                <div class="flex items-center justify-between">
                  <span class="font-semibold text-gray-800">${r.student_name}</span> 
                  <span class="text-amber-500 font-bold">${"⭐".repeat(r.rating)} <span class="text-gray-400 font-normal text-[10px]">(${r.rating}/5)</span></span>
                </div>
                <p class="text-gray-600 mt-1 text-xs">"${r.comment}"</p>
                <span class="text-gray-400 text-[10px] block mt-1 text-right">${r.created_at}</span>
              </div>`;
            });
            reviewList += `</div>`;
          }

          unitsHtml += `<div class="p-4 border ${isAvail ? 'border-blue-200 bg-white hover:border-blue-400 shadow-xs' : 'border-gray-200 bg-gray-50 opacity-75'} rounded-2xl transition-all">
            <div class="flex items-center justify-between">
              <div>
                <span class="font-mono font-bold text-sm text-blue-900 bg-blue-100/80 px-2.5 py-1 rounded-lg border border-blue-300">🏷️ ${u.asset_tag}</span>
                <span class="ml-2 text-xs text-amber-600 font-bold">${ratingStars}</span>
                ${toggleBtn}
                ${u.note ? `<p class="text-xs text-amber-700 mt-1 font-medium">⚠️ หมายเหตุคลัง: ${u.note}</p>` : ""}
              </div>
              <div>
                ${u.status === "AVAILABLE" ? `<button onclick="p_item_detail_addToCartWithSerial(${item.id}, '${u.asset_tag}')" class="bg-blue-600 hover:bg-blue-700 active:scale-95 text-white text-xs font-bold rounded-xl px-4 py-2 shadow-sm shadow-blue-200 transition-all">+ เลือกชิ้นนี้ลงตะกร้า</button>`
                  : u.status === "BORROWED" ? `<button onclick="p_item_detail_joinQueueForUnit(${item.id}, '${u.asset_tag}')" class="bg-amber-400 hover:bg-amber-500 active:scale-95 text-amber-950 text-xs font-bold rounded-xl px-3 py-1.5 shadow-sm transition-all flex items-center gap-1"><span>⏳</span> จองคิวรหัสนี้</button>`
                  : u.status === "DAMAGED" ? `<span class="text-xs font-semibold bg-red-100 text-red-700 px-3 py-1 rounded-full">ชำรุด/ส่งซ่อม</span>`
                  : `<span class="text-xs font-semibold bg-gray-200 text-gray-700 px-3 py-1 rounded-full">${u.status}</span>`}
              </div>
            </div>
            ${reviewList}
          </div>`;
        });
        unitsHtml += `</div></div>`;
      }

      host.innerHTML = `<div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-6">
        <div class="flex gap-5">
          <div class="text-7xl">${item.image}</div>
          <div class="flex-1">
            <h1 class="text-xl font-bold text-gray-800">${item.name}</h1>
            <p class="text-sm text-gray-500">${cat ? cat.name : ""} · ${item.type === 'equipment' ? 'ครุภัณฑ์ (ต้องคืน)' : 'วัสดุ (เบิกใช้แล้วหมดไป)'}</p>
            <div class="flex gap-2 mt-2">
              ${unavailable ? `<span class="inline-flex items-center rounded-full px-2.5 py-0.5 text-xs font-semibold bg-gray-200 text-gray-600">ไม่พร้อมใช้งาน</span>`
                : empty ? `<span class="inline-flex items-center rounded-full px-2.5 py-0.5 text-xs font-semibold bg-red-100 text-red-700">ถูกยืมหมด</span>`
                : `<span class="inline-flex items-center rounded-full px-2.5 py-0.5 text-xs font-semibold bg-green-100 text-green-700">พร้อมให้ยืม</span>`}
            </div>
          </div>
        </div>
        <div class="grid grid-cols-3 gap-3 mt-5 text-sm">
          <div class="bg-gray-50 rounded-xl p-3"><p class="text-xs text-gray-400">จำนวนคงเหลือ</p><p class="font-mono font-semibold">${item.qty_available} / ${item.qty_total}</p></div>
          <div class="bg-gray-50 rounded-xl p-3"><p class="text-xs text-gray-400">ตำแหน่งชั้นวาง</p><p class="font-semibold">${pos ? pos.name : "-"}</p></div>
          <div class="bg-gray-50 rounded-xl p-3"><p class="text-xs text-gray-400">ยืมได้สูงสุด</p><p class="font-semibold">${item.max_borrow_days ? item.max_borrow_days + " วัน" : "ไม่มีกำหนดคืน"}</p></div>
        </div>
        ${queue.length ? `<div class="mt-4 bg-yellow-50 border border-yellow-200 rounded-xl p-3 text-sm text-yellow-800">มีผู้จองคิวอยู่ ${queue.length} คน ${myPos > 0 ? `(คุณอยู่ลำดับที่ ${myPos})` : ""}</div>` : ""}
        
        ${unitsHtml}

        <div class="flex gap-3 mt-6">
          <a href="javascript:void(0)" onclick="navigate('position-map', {id: ${item.id}})" class="bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 text-sm font-semibold rounded-xl px-4 py-2">🗺️ ดูตำแหน่งชั้นวาง</a>
          ${unavailable ? "" : empty
            ? `<button onclick="p_item_detail_joinQueue(${item.id})" class="bg-yellow-400 hover:bg-yellow-500 text-blue-900 text-sm font-semibold rounded-xl px-4 py-2">จองคิว</button>`
            : item.type === 'material' ? `<button onclick="p_item_detail_addToCart(${item.id})" class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold rounded-xl px-4 py-2">+ เพิ่มลงตะกร้า</button>` : ""}
        </div>
      </div>`;
    }

    function p_item_detail_addToCart(id) {
      const cart = db("cart");
      const existing = cart.find(c => c.item_id === id);
      if (existing) existing.qty += 1; else cart.push({ item_id: id, qty: 1 });
      dbSave("cart", cart);
      toastBanner("เพิ่มลงตะกร้าแล้ว");
      p_item_detail_init();
    }
    function p_item_detail_addToCartWithSerial(id, assetTag) {
      const cart = db("cart");
      const existing = cart.find(c => c.item_id === id && c.asset_tag === assetTag);
      if (existing) {
        toastBanner("ครุภัณฑ์ชิ้นนี้อยู่ในตะกร้าแล้ว", "info");
        return;
      }
      cart.push({ item_id: id, asset_tag: assetTag, qty: 1 });
      dbSave("cart", cart);
      toastBanner(`เพิ่มครุภัณฑ์รหัส ${assetTag} ลงตะกร้าแล้ว`);
      p_item_detail_init();
    }
    function p_item_detail_joinQueue(id) {
      const queue = db("queue");
      const stu = currentUserId();
      if (queue.some(q => q.item_id === id && q.student_id === stu)) { toastBanner("คุณอยู่ในคิวแล้ว", "error"); return; }
      queue.push({ id: nextId(queue), item_id: id, student_id: stu, joined_at: "2026-07-23" });
      dbSave("queue", queue);
      toastBanner("จองคิวสำเร็จ");
      p_item_detail_init();
    }
    function p_item_detail_joinQueueForUnit(id, assetTag) {
      const queue = db("queue");
      const stu = currentUserId();
      if (queue.some(q => q.item_id === id && q.asset_tag === assetTag && q.student_id === stu)) {
        toastBanner(`คุณอยู่ในคิวของรหัส ${assetTag} เรียบร้อยแล้ว`, "info");
        return;
      }
      queue.push({ id: nextId(queue), item_id: id, asset_tag: assetTag, student_id: stu, joined_at: "2026-07-23 " + new Date().toTimeString().slice(0,5) });
      dbSave("queue", queue);
      const myPos = queue.filter(q => q.asset_tag === assetTag).findIndex(q => q.student_id === stu) + 1;
      toastBanner(`จองคิวครุภัณฑ์รหัส ${assetTag} สำเร็จ (ลำดับที่ ${myPos})`);
      p_item_detail_init();
    }
    function p_item_detail_toggleReviews(assetTag) {
      const el = document.getElementById("reviews-" + assetTag);
      if (el) el.classList.toggle("hidden");
    }
</script>
</body>
</html>
