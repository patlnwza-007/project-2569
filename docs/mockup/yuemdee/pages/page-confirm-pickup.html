<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Bai+Jamjuree:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ['Sarabun', 'Thonburi', 'Bai Jamjuree', 'Inter', 'sans-serif'],
          heading: ['Sarabun', 'Thonburi', 'Space Grotesk', 'sans-serif'],
          mono: ['IBM Plex Mono', 'monospace'],
        }
      }
    }
  }
</script>
<style>
  html, body, button, input, select, textarea, div, p, span, h1, h2, h3, h4, h5, h6 {
    font-family: 'Sarabun', 'Thonburi', 'Bai Jamjuree', 'Inter', sans-serif !important;
  }
  .font-mono, code, pre { font-family: 'IBM Plex Mono', monospace !important; }
  .tab.active { border-bottom: 2px solid #2563eb; color: #2563eb; font-weight: 600; }
  html, body { margin: 0; height: 100%; }
</style>
<title>YuemDee · confirm-pickup</title>
</head>
<body class="bg-gray-50" onload="p_confirm_pickup_init()">

<div id="view-confirm-pickup" class="w-full h-full overflow-y-auto p-6">
<div class="max-w-xl mx-auto">
    <a href="javascript:void(0)" onclick="navigate('request-list')" class="text-sm text-blue-600 hover:underline">← กลับหน้าหลัก</a>
    <div id="p_confirm_pickup_content" class="mt-3"></div>
  </div>
</div>

<script src="../shared.js"></script>
<script>
function p_confirm_pickup_init() {
      notifyParentPage("confirm-pickup");
      const rid = Number(qparam("rid"));
      const reqs = db("requests");
      const r = reqs.find(x => x.id === rid);
      const host = document.getElementById("p_confirm_pickup_content");
      if (!r || r.status !== "APPROVED_WAIT_PICKUP") {
        host.innerHTML = `<div class="bg-white rounded-2xl border p-8 text-center text-gray-500 mt-3">ไม่พบคำขอที่รอรับของนี้ (อาจหมดอายุหรือดำเนินการไปแล้ว)</div>`;
        return;
      }
      const units = db("units");
      const itemSummaries = r.items.map(it => {
        const i = itemById(it.item_id);
        const assignedUnit = units.find(u => u.item_id === it.item_id && u.current_request_id === r.id);
        return `<div class="py-1">
          <div class="font-medium">${i.image} ${i.name} × ${it.qty} <span class="text-xs text-gray-400">(${i.type==='equipment'?'ครุภัณฑ์':'วัสดุ'})</span></div>
          ${assignedUnit ? `<div class="mt-1"><span class="bg-blue-100 text-blue-800 font-mono text-xs px-2 py-0.5 rounded-md font-bold">🏷️ รหัสประจำชิ้น: ${assignedUnit.asset_tag}</span></div>` : ''}
        </div>`;
      }).join("");

      host.innerHTML = `<div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-6 mt-3">
        <h1 class="text-lg font-bold text-gray-800 mb-1">คำขอ #${r.id} — อนุมัติแล้ว/รอรับของ</h1>
        <p class="text-sm text-gray-500 mb-4">กรุณาตรวจสอบรหัสประจำชิ้นกับเจ้าหน้าที่ก่อนยื่นรับของ แล้วกดยืนยันรับของในระบบ</p>
        <div class="bg-gray-50 rounded-xl p-4 text-sm space-y-2 mb-4 border border-gray-100">
          ${itemSummaries}
        </div>
        <div class="mb-4">
          <label class="block text-xs font-semibold text-gray-700 mb-1">📸 ถ่ายรูป/แนบรูปหลักฐานสภาพสิ่งของก่อนรับ (ป้องกันข้อพิพาทสภาพพัง):</label>
          <input type="file" id="p_confirm_pickup_photo_input" accept="image/*" class="w-full text-xs text-gray-500 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100" />
          <p class="text-[11px] text-gray-400 mt-1">* แนะนำให้ถ่ายรูปตำแหน่งที่มีรอยตำหนิเดิมเพื่อเป็นหลักฐานยืนยันกับคลัง</p>
        </div>
        <p class="text-xs text-amber-600 mb-4">⏰ อนุมัติเมื่อ ${r.approved_at} — ต้องยืนยันรับของภายใน 2 วัน มิฉะนั้นระบบจะดึงของกลับคลังและเปลี่ยนสถานะเป็น "หมดอายุ" อัตโนมัติ</p>
        <button onclick="p_confirm_pickup_confirmPickup(${r.id})" class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold rounded-xl px-5 py-2.5 shadow-sm">✓ ยืนยันรับของแล้ว</button>
      </div>`;
    }
    function p_confirm_pickup_confirmPickup(rid) {
      const reqs = db("requests");
      const r = reqs.find(x => x.id === rid);
      const items = db("items");
      let allMaterial = true;
      r.items.forEach(it => {
        const item = items.find(i => i.id === it.item_id);
        if (item.type === "equipment") allMaterial = false;
      });
      r.picked_up_at = "2026-07-23 " + new Date().toTimeString().slice(0,5);
      const photoInput = document.getElementById("p_confirm_pickup_photo_input");
      if (photoInput && photoInput.files && photoInput.files[0]) {
        r.pickup_photo = URL.createObjectURL(photoInput.files[0]);
      } else {
        r.pickup_photo = "https://images.unsplash.com/photo-1517841905240-472988babdf9?w=300"; // default mock image
      }
      if (allMaterial) {
        r.status = "ISSUED";
      } else {
        r.status = "BORROWING";
        const maxDays = Math.max(...r.items.map(it => items.find(i => i.id === it.item_id).max_borrow_days || 7));
        const due = new Date("2026-07-23T00:00:00"); due.setDate(due.getDate() + maxDays);
        r.due_date = due.toISOString().slice(0,10);
      }
      dbSave("requests", reqs);
      dbSave("items", items);
      toastBanner("ยืนยันรับของสำเร็จ");
      setTimeout(() => navigate("request-list"), 700);
    }
</script>
</body>
</html>
