<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Bai+Jamjuree:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ['Sarabun', 'Thonburi', 'Bai Jamjuree', 'Inter', 'sans-serif'],
          heading: ['Sarabun', 'Thonburi', 'Space Grotesk', 'sans-serif'],
          mono: ['IBM Plex Mono', 'monospace'],
        }
      }
    }
  }
</script>
<style>
  html, body, button, input, select, textarea, div, p, span, h1, h2, h3, h4, h5, h6 {
    font-family: 'Sarabun', 'Thonburi', 'Bai Jamjuree', 'Inter', sans-serif !important;
  }
  .font-mono, code, pre { font-family: 'IBM Plex Mono', monospace !important; }
  .tab.active { border-bottom: 2px solid #2563eb; color: #2563eb; font-weight: 600; }
  html, body { margin: 0; height: 100%; }
</style>
<title>YuemDee · all-history</title>
</head>
<body class="bg-gray-50" onload="p_all_history_init()">

<div id="view-all-history" class="w-full h-full overflow-y-auto p-6">
<div class="max-w-5xl mx-auto">
    <h1 class="text-2xl font-bold text-gray-800 mb-1">ประวัติการยืม-คืนทั้งระบบ</h1>
    <p class="text-sm text-gray-500 mb-4">ค้นหา/กรองตามชื่อนักศึกษาหรือช่วงวันที่</p>
    <div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-4 mb-4 flex flex-wrap gap-3 items-end">
      <div class="flex-1 min-w-[200px]"><label class="text-xs font-semibold text-gray-500">ค้นหาชื่อ/รหัสนักศึกษา</label>
        <input id="p_all_history_q" oninput="p_all_history_render()" class="w-full mt-1 border border-gray-300 rounded-lg px-3 py-2 text-sm"></div>
      <div><label class="text-xs font-semibold text-gray-500">ตั้งแต่วันที่</label><input id="p_all_history_from" type="date" onchange="p_all_history_render()" class="mt-1 border border-gray-300 rounded-lg px-3 py-2 text-sm"></div>
      <div><label class="text-xs font-semibold text-gray-500">ถึงวันที่</label><input id="p_all_history_to" type="date" onchange="p_all_history_render()" class="mt-1 border border-gray-300 rounded-lg px-3 py-2 text-sm"></div>
    </div>
    <div class="bg-white rounded-2xl border border-gray-200 shadow-sm overflow-hidden">
      <table class="w-full text-sm">
        <thead class="bg-gray-50 text-xs uppercase tracking-wider text-gray-500"><tr>
          <th class="text-left px-4 py-2">#</th><th class="text-left px-4 py-2">นักศึกษา</th><th class="text-left px-4 py-2">รายการ</th>
          <th class="text-left px-4 py-2">วันที่ส่งคำขอ</th><th class="text-left px-4 py-2">สถานะ</th></tr></thead>
        <tbody id="p_all_history_rows"></tbody>
      </table>
      <div id="p_all_history_empty" class="hidden p-10 text-center text-gray-500">ไม่พบข้อมูล</div>
    </div>
  </div>
</div>

<script src="../shared.js"></script>
<script>
function p_all_history_init() { notifyParentPage("all-history"); p_all_history_render(); }
    function p_all_history_render() {
      const q = document.getElementById("p_all_history_q").value.trim().toLowerCase();
      const from = document.getElementById("p_all_history_from").value;
      const to = document.getElementById("p_all_history_to").value;
      let reqs = db("requests");
      if (q) reqs = reqs.filter(r => { const s = studentById(r.student_id); return (s && s.name.toLowerCase().includes(q)) || r.student_id.toLowerCase().includes(q); });
      if (from) reqs = reqs.filter(r => r.created_at.slice(0,10) >= from);
      if (to) reqs = reqs.filter(r => r.created_at.slice(0,10) <= to);
      reqs = reqs.sort((a,b)=>(b.created_at||"").localeCompare(a.created_at||""));
      const host = document.getElementById("p_all_history_rows");
      document.getElementById("p_all_history_empty").classList.toggle("hidden", reqs.length !== 0);
      host.innerHTML = reqs.map(r => {
        const stu = studentById(r.student_id);
        return `<tr class="hover:bg-gray-50 border-t border-gray-100">
          <td class="px-4 py-2 font-mono text-xs">#${r.id}</td>
          <td class="px-4 py-2">${stu ? stu.name : r.student_id} <span class="text-xs text-gray-400 font-mono">(${r.student_id})</span></td>
          <td class="px-4 py-2 text-xs">${r.items.map(it=>itemById(it.item_id)?.name).join(", ")}</td>
          <td class="px-4 py-2 text-xs text-gray-500">${r.created_at}</td>
          <td class="px-4 py-2">${badgeHtml(r.status)}</td>
        </tr>`;
      }).join("");
    }
</script>
</body>
</html>
