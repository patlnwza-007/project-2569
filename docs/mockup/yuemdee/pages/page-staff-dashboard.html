<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Bai+Jamjuree:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ['Sarabun', 'Thonburi', 'Bai Jamjuree', 'Inter', 'sans-serif'],
          heading: ['Sarabun', 'Thonburi', 'Space Grotesk', 'sans-serif'],
          mono: ['IBM Plex Mono', 'monospace'],
        }
      }
    }
  }
</script>
<style>
  html, body, button, input, select, textarea, div, p, span, h1, h2, h3, h4, h5, h6 {
    font-family: 'Sarabun', 'Thonburi', 'Bai Jamjuree', 'Inter', sans-serif !important;
  }
  .font-mono, code, pre { font-family: 'IBM Plex Mono', monospace !important; }
  .tab.active { border-bottom: 2px solid #2563eb; color: #2563eb; font-weight: 600; }
  html, body { margin: 0; height: 100%; }
</style>
<title>YuemDee · staff-dashboard</title>
</head>
<body class="bg-gray-50" onload="p_staff_dashboard_init()">

<div id="view-staff-dashboard" class="w-full h-full overflow-y-auto p-6">
<div class="max-w-6xl mx-auto">
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-5">
      <div>
        <h1 class="text-2xl font-bold text-gray-900">📊 แดชบอร์ดภาพรวมระบบ</h1>
        <p class="text-sm text-gray-500 mt-0.5">ภาพรวมสถานการณ์ยืม-คืนทั้งระบบ อัปเดตล่าสุดวันนี้</p>
      </div>
    </div>

    <!-- Urgent Action Banner -->
    <div id="p_staff_dashboard_action_banner" class="hidden mb-6"></div>

    <div id="p_staff_dashboard_kpis" class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6"></div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
      <div class="lg:col-span-2 bg-white rounded-2xl border border-gray-200 shadow-sm p-5">
        <p class="text-sm font-semibold text-gray-700 mb-3">สถานะการยืมทั้งหมด</p>
        <div id="p_staff_dashboard_bar-chart" class="space-y-2"></div>
      </div>
      <div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-5">
        <p class="text-sm font-semibold text-gray-700 mb-3">สัดส่วนนักศึกษา</p>
        <div id="p_staff_dashboard_donut" class="flex flex-col items-center"></div>
      </div>
    </div>


  </div>
</div>

<script src="../shared.js"></script>
<script>
function p_staff_dashboard_init() {
  notifyParentPage("staff-dashboard");
  const reqs = db("requests");
  const students = db("students");

  const pending = reqs.filter(r => r.status === "PENDING").length;
  const borrowing = reqs.filter(r => r.status === "BORROWING").length;
  const returnPending = reqs.filter(r => r.status === "RETURN_PENDING").length;
  const overdue = reqs.filter(r => r.status === "BORROWING" && daysLeft(r.due_date) < 0).length;

  // ── Urgent Action Banner ────────────────────────────────────────────────
  const bannerEl = document.getElementById("p_staff_dashboard_action_banner");
  if (bannerEl) {
    if (pending > 0 || returnPending > 0 || overdue > 0) {
      bannerEl.className = "mb-6 bg-gradient-to-r from-blue-600 to-indigo-700 text-white rounded-2xl p-4 shadow-sm flex flex-col sm:flex-row sm:items-center justify-between gap-4";
      bannerEl.innerHTML = `
        <div>
          <div class="flex items-center gap-2 font-bold text-sm">
            <span>⚡ รายการที่รอการดำเนินการจากเจ้าหน้าที่</span>
          </div>
          <div class="flex flex-wrap gap-x-4 gap-y-1 text-xs text-blue-100 mt-1">
            ${pending > 0 ? `<span>• คำขอรออนุมัติ: <strong class="text-white">${pending}</strong> รายการ</span>` : ""}
            ${returnPending > 0 ? `<span>• ครุภัณฑ์รอตรวจรับคืน: <strong class="text-white">${returnPending}</strong> รายการ</span>` : ""}
            ${overdue > 0 ? `<span>• ครุภัณฑ์เกินกำหนดคืน: <strong class="text-amber-300">${overdue}</strong> รายการ</span>` : ""}
          </div>
        </div>
        <div class="flex items-center gap-2 shrink-0">
          ${pending > 0 ? `<a href="javascript:void(0)" onclick="navigate('pending-requests')" class="bg-white/20 hover:bg-white/30 text-white text-xs font-semibold px-3 py-2 rounded-xl transition-all">ไปอนุมัติคำขอ →</a>` : ""}
          ${returnPending > 0 ? `<a href="javascript:void(0)" onclick="navigate('return-list')" class="bg-white text-blue-700 hover:bg-blue-50 text-xs font-semibold px-3 py-2 rounded-xl transition-all">ไปรับคืนครุภัณฑ์ →</a>` : ""}
        </div>`;
      bannerEl.classList.remove("hidden");
    } else {
      bannerEl.classList.add("hidden");
    }
  }

  // ── KPIs Grid ────────────────────────────────────────────────────────────
  const kpis = [
    { label: "รออนุมัติ", val: pending, bg: "bg-amber-50", text: "text-amber-700", border: "border-amber-200", icon: "🕐" },
    { label: "กำลังยืมอยู่", val: borrowing, bg: "bg-indigo-50", text: "text-indigo-700", border: "border-indigo-200", icon: "📦" },
    { label: "รอยืนยันการคืน", val: returnPending, bg: "bg-orange-50", text: "text-orange-700", border: "border-orange-200", icon: "↩️" },
    { label: "คำขอทั้งหมด", val: reqs.length, bg: "bg-gray-50", text: "text-gray-700", border: "border-gray-200", icon: "📋" },
  ];

  document.getElementById("p_staff_dashboard_kpis").innerHTML = kpis.map(k => `
    <div class="bg-white rounded-2xl border ${k.border} shadow-sm p-4 hover:shadow-md transition-all">
      <div class="flex items-center justify-between">
        <div>
          <p class="text-xs text-gray-500 font-medium">${k.label}</p>
          <p class="text-2xl font-bold ${k.text} mt-0.5">${k.val}</p>
        </div>
        <div class="text-2xl ${k.bg} rounded-xl w-11 h-11 flex items-center justify-center">${k.icon}</div>
      </div>
    </div>`).join("");

  // ── Status Distribution Bar Chart ───────────────────────────────────────
  const chartItems = [
    { key: "PENDING", label: "รออนุมัติ", count: reqs.filter(r => r.status === "PENDING").length, color: "bg-blue-500" },
    { key: "APPROVED_WAIT_PICKUP", label: "อนุมัติแล้ว/รอรับของ", count: reqs.filter(r => r.status === "APPROVED_WAIT_PICKUP").length, color: "bg-blue-500" },
    { key: "BORROWING", label: "กำลังยืม", count: reqs.filter(r => r.status === "BORROWING").length, color: "bg-blue-500" },
    { key: "RETURN_PENDING", label: "รอยืนยันการคืน", count: reqs.filter(r => r.status === "RETURN_PENDING").length, color: "bg-blue-500" },
    { key: "RETURNED", label: "คืนสำเร็จ", count: reqs.filter(r => r.status === "RETURNED").length, color: "bg-blue-500" },
    { key: "ISSUED", label: "เบิกสำเร็จ", count: reqs.filter(r => r.status === "ISSUED").length, color: "bg-blue-500" },
    { key: "REJECTED", label: "ถูกปฏิเสธ", count: reqs.filter(r => r.status === "REJECTED").length, color: "bg-blue-500" },
    { key: "CANCELLED", label: "ยกเลิกแล้ว", count: reqs.filter(r => r.status === "CANCELLED").length, color: "bg-blue-500" },
    { key: "OVERDUE", label: "🔴 คืนเกินกำหนด", count: reqs.filter(r => r.status === "BORROWING" && daysLeft(r.due_date) < 0).length, color: "bg-red-500" },
  ];

  const maxVal = Math.max(1, ...chartItems.map(c => c.count));
  document.getElementById("p_staff_dashboard_bar-chart").innerHTML = chartItems.map(item => `
    <div class="flex items-center gap-2 text-xs">
      <span class="w-36 ${item.key === 'OVERDUE' ? 'font-bold text-red-600' : 'text-gray-500'} shrink-0">${item.label}</span>
      <div class="flex-1 bg-gray-100 rounded-full h-4 overflow-hidden"><div class="h-4 ${item.color} rounded-full" style="width:${(item.count/maxVal*100)}%"></div></div>
      <span class="w-6 text-right font-mono ${item.key === 'OVERDUE' && item.count > 0 ? 'font-bold text-red-600' : ''}">${item.count}</span>
    </div>`).join("");

  // ── Student Status Donut Chart ──────────────────────────────────────────
  const blocked = students.filter(s => s.blocked).length;
  const normal = students.length - blocked;
  const pct = students.length ? Math.round(normal/students.length*100) : 0;
  document.getElementById("p_staff_dashboard_donut").innerHTML = `
    <div class="w-32 h-32 rounded-full flex items-center justify-center shadow-inner" style="background: conic-gradient(#2563eb 0% ${pct}%, #facc15 ${pct}% 100%)">
      <div class="w-20 h-20 bg-white rounded-full flex items-center justify-center text-sm font-bold text-gray-700 shadow-sm">${pct}%</div>
    </div>
    <div class="flex gap-4 mt-4 text-xs">
      <span class="flex items-center gap-1.5 font-medium"><span class="w-3 h-3 rounded-full bg-blue-600 inline-block"></span>ปกติ (${normal})</span>
      <span class="flex items-center gap-1.5 font-medium"><span class="w-3 h-3 rounded-full bg-yellow-400 inline-block"></span>ถูกระงับ (${blocked})</span>
    </div>`;

}
</script>
</body>
</html>
