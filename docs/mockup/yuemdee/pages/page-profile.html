<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Bai+Jamjuree:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ['Sarabun', 'Thonburi', 'Bai Jamjuree', 'Inter', 'sans-serif'],
          heading: ['Sarabun', 'Thonburi', 'Space Grotesk', 'sans-serif'],
          mono: ['IBM Plex Mono', 'monospace'],
        }
      }
    }
  }
</script>
<style>
  html, body, button, input, select, textarea, div, p, span, h1, h2, h3, h4, h5, h6 {
    font-family: 'Sarabun', 'Thonburi', 'Bai Jamjuree', 'Inter', sans-serif !important;
  }
  .font-mono, code, pre { font-family: 'IBM Plex Mono', monospace !important; }
  .tab.active { border-bottom: 2px solid #2563eb; color: #2563eb; font-weight: 600; }
  html, body { margin: 0; height: 100%; }
</style>
<title>YuemDee · profile</title>
</head>
<body class="bg-gray-50" onload="p_profile_init()">

<div id="view-profile" class="w-full h-full overflow-y-auto p-6">
<div class="max-w-xl mx-auto">
    <h1 class="text-2xl font-bold text-gray-800 mb-1">โปรไฟล์ส่วนตัว</h1>
    <p class="text-sm text-gray-500 mb-6">แก้ไขข้อมูลติดต่อของคุณให้เป็นปัจจุบัน — ต้องกรอกเบอร์โทรศัพท์ให้ครบก่อนจึงจะส่งคำขอยืมได้</p>

    <div id="p_profile_notice-return" class="hidden mb-4 bg-amber-50 border border-amber-300 text-amber-800 rounded-xl p-3 text-sm">
      กรุณากรอกเบอร์โทรศัพท์ให้ครบก่อน เพื่อกลับไปส่งคำขอยืมต่อ
    </div>

    <div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-6 space-y-4">
      <div>
        <label class="text-sm font-semibold text-gray-700">รหัสนักศึกษา</label>
        <input disabled id="p_profile_f-id" class="w-full mt-1 border border-gray-200 bg-gray-50 rounded-lg px-3 py-2 text-sm font-mono">
      </div>
      <div>
        <label class="text-sm font-semibold text-gray-700">ชื่อ-นามสกุล</label>
        <input disabled id="p_profile_f-name" class="w-full mt-1 border border-gray-200 bg-gray-50 rounded-lg px-3 py-2 text-sm">
      </div>
      <div>
        <label class="text-sm font-semibold text-gray-700">อีเมล</label>
        <input disabled id="p_profile_f-email" class="w-full mt-1 border border-gray-200 bg-gray-50 rounded-lg px-3 py-2 text-sm">
      </div>
      <div>
        <label class="text-sm font-semibold text-gray-700">เบอร์โทรศัพท์ <span class="text-red-500">*</span></label>
        <input id="p_profile_f-phone" placeholder="เช่น 0812345678" class="w-full mt-1 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300">
        <p id="p_profile_phone-error" class="hidden text-xs text-red-600 mt-1">กรุณากรอกเบอร์โทรศัพท์ก่อนบันทึก</p>
      </div>
      <div class="grid grid-cols-2 gap-4 pt-2 border-t border-gray-100">
        <div><p class="text-xs text-gray-400">เข้าสู่ระบบครั้งแรก</p><p id="p_profile_f-first" class="text-sm font-mono"></p></div>
        <div><p class="text-xs text-gray-400">เข้าสู่ระบบล่าสุด</p><p id="p_profile_f-last" class="text-sm font-mono"></p></div>
      </div>
      <button onclick="p_profile_save()" class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold rounded-xl px-4 py-2">บันทึกข้อมูล</button>
    </div>
  </div>
</div>

<script src="../shared.js"></script>
<script>
function p_profile_init() {
      notifyParentPage("profile");
      const stu = currentStudent();
      if (!stu) return;
      document.getElementById("p_profile_f-id").value = stu.id;
      document.getElementById("p_profile_f-name").value = stu.name;
      document.getElementById("p_profile_f-email").value = stu.email;
      document.getElementById("p_profile_f-phone").value = stu.phone || "";
      document.getElementById("p_profile_f-first").textContent = stu.first_login;
      document.getElementById("p_profile_f-last").textContent = stu.last_login;
      if (qparam("return") === "cart") {
        document.getElementById("p_profile_notice-return").classList.remove("hidden");
      }
    }
    function p_profile_save() {
      const phone = document.getElementById("p_profile_f-phone").value.trim();
      if (!phone) {
        document.getElementById("p_profile_phone-error").classList.remove("hidden");
        return;
      }
      document.getElementById("p_profile_phone-error").classList.add("hidden");
      const students = db("students");
      const stu = students.find(s => s.id === currentUserId());
      stu.phone = phone;
      dbSave("students", students);
      toastBanner("บันทึกข้อมูลส่วนตัวสำเร็จ");
      if (qparam("return") === "cart") {
        setTimeout(() => navigate("cart"), 600);
      }
    }
</script>
</body>
</html>
