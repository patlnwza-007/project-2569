<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Bai+Jamjuree:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ['Sarabun', 'Thonburi', 'Bai Jamjuree', 'Inter', 'sans-serif'],
          heading: ['Sarabun', 'Thonburi', 'Space Grotesk', 'sans-serif'],
          mono: ['IBM Plex Mono', 'monospace'],
        }
      }
    }
  }
</script>
<style>
  html, body, button, input, select, textarea, div, p, span, h1, h2, h3, h4, h5, h6 {
    font-family: 'Sarabun', 'Thonburi', 'Bai Jamjuree', 'Inter', sans-serif !important;
  }
  .font-mono, code, pre { font-family: 'IBM Plex Mono', monospace !important; }
  .tab.active { border-bottom: 2px solid #2563eb; color: #2563eb; font-weight: 600; }
  html, body { margin: 0; height: 100%; }
</style>
<title>YuemDee · student-permission</title>
</head>
<body class="bg-gray-50" onload="p_student_permission_init()">

<div id="view-student-permission" class="w-full h-full overflow-y-auto p-6">
<div class="max-w-xl mx-auto">
    <a href="javascript:void(0)" onclick="navigate('student-list')" class="text-sm text-blue-600 hover:underline">← กลับรายชื่อนักศึกษา</a>
    <div id="p_student_permission_content" class="mt-3"></div>
  </div>
</div>

<script src="../shared.js"></script>
<script>
function p_student_permission_init() {
      notifyParentPage("student-permission");
      const isAdmin = getRole() === "admin";
      const id = qparam("id");
      const stu = studentById(id);
      const host = document.getElementById("p_student_permission_content");
      if (!stu) { host.innerHTML = `<div class="bg-white rounded-2xl border p-8 text-center text-gray-500">ไม่พบนักศึกษานี้</div>`; return; }

      const permissionControls = isAdmin
        ? `<div class="mt-5 pt-4 border-t border-gray-100 flex items-center gap-3">
             ${stu.blocked
               ? `<button onclick="p_student_permission_unblock()" class="bg-green-600 hover:bg-green-700 text-white text-sm font-semibold rounded-xl px-4 py-2 transition-all shadow-sm">ปลดบล็อกสิทธิ์การยืม</button>`
               : `<button onclick="p_student_permission_blockPrompt()" class="bg-red-600 hover:bg-red-700 text-white text-sm font-semibold rounded-xl px-4 py-2 transition-all shadow-sm">ระงับสิทธิ์การยืม (Block)</button>`}
             <a href="javascript:void(0)" onclick="navigate('user-list')" class="text-xs text-gray-500 hover:text-gray-700 ml-auto">ไปหน้าจัดการบัญชีผู้ใช้ทั้งหมด →</a>
           </div>`
        : `<div class="mt-5 pt-4 border-t border-gray-100">
             <div class="bg-amber-50 border border-amber-200 text-amber-800 rounded-xl p-3 text-xs flex items-center gap-2">
               <span>⚠️</span>
               <span><b>จำกัดสิทธิ์เฉพาะผู้ดูแลระบบ (Admin):</b> เจ้าหน้าที่ไม่สามารถระงับสิทธิ์หรือปลดบล็อกนักศึกษาได้ หากพบการกระทำผิดระเบียบกรุณาแจ้งผู้ดูแลระบบ</span>
             </div>
           </div>`;

      host.innerHTML = `<div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-6">
        <div class="flex items-center justify-between mb-2">
          <span class="text-xs font-semibold px-2.5 py-1 rounded-full ${isAdmin ? 'bg-purple-100 text-purple-800 border border-purple-200' : 'bg-gray-100 text-gray-600'}">
            ${isAdmin ? '👑 โหมดผู้ดูแลระบบ (Admin)' : '👁️ มุมมองตรวจสอบ (Read-Only)'}
          </span>
        </div>
        <h1 class="text-xl font-bold text-gray-800">${stu.name} <span class="text-xs text-gray-400 font-mono font-normal">(${stu.id})</span></h1>
        <p class="text-xs font-mono text-gray-500 mt-1">${stu.email || ''}</p>
        <p class="text-sm mt-3">สถานะสิทธิ์การยืม: ${stu.blocked ? '<span class="text-red-600 font-semibold">🔴 ถูกระงับสิทธิ์การยืม</span>' : '<span class="text-green-600 font-semibold">🟢 ปกติ</span>'}</p>
        ${stu.blocked ? `<p class="text-xs text-gray-500 mt-1 bg-red-50 p-2.5 rounded-lg border border-red-100">สาเหตุที่ระงับ: ${stu.block_reason || 'ไม่ระบุ'}</p>` : ""}
        ${permissionControls}
      </div>`;
    }
    function p_student_permission_blockPrompt() {
      if (getRole() !== "admin") { toastBanner("เฉพาะ Admin เท่านั้นที่ระงับสิทธิ์ได้", "error"); return; }
      const reason = prompt("เหตุผลการระงับสิทธิ์การยืม:");
      if (reason === null || !reason.trim()) { if(reason!==null) toastBanner("ต้องระบุเหตุผล","error"); return; }
      const id = qparam("id"); const students = db("students");
      const stu = students.find(s => s.id === id);
      stu.blocked = true; stu.block_reason = reason.trim();
      dbSave("students", students);
      toastBanner("ระงับสิทธิ์การยืมสำเร็จ");
      p_student_permission_init();
    }
    function p_student_permission_unblock() {
      if (getRole() !== "admin") { toastBanner("เฉพาะ Admin เท่านั้นที่ปลดบล็อกได้", "error"); return; }
      const id = qparam("id"); const students = db("students");
      const stu = students.find(s => s.id === id);
      stu.blocked = false; stu.block_reason = "";
      dbSave("students", students);
      toastBanner("ปลดบล็อกสิทธิ์การยืมสำเร็จ");
      p_student_permission_init();
    }
</script>
</body>
</html>
