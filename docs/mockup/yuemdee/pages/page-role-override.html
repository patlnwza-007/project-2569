<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Bai+Jamjuree:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ['Sarabun', 'Thonburi', 'Bai Jamjuree', 'Inter', 'sans-serif'],
          heading: ['Sarabun', 'Thonburi', 'Space Grotesk', 'sans-serif'],
          mono: ['IBM Plex Mono', 'monospace'],
        }
      }
    }
  }
</script>
<style>
  html, body, button, input, select, textarea, div, p, span, h1, h2, h3, h4, h5, h6 {
    font-family: 'Sarabun', 'Thonburi', 'Bai Jamjuree', 'Inter', sans-serif !important;
  }
  .font-mono, code, pre { font-family: 'IBM Plex Mono', monospace !important; }
  .tab.active { border-bottom: 2px solid #2563eb; color: #2563eb; font-weight: 600; }
  html, body { margin: 0; height: 100%; }
</style>
<title>YuemDee · role-override</title>
</head>
<body class="bg-gray-50" onload="p_role_override_init()">

<div id="view-role-override" class="w-full h-full overflow-y-auto p-6">
<a id="p_role_override_back-link" href="javascript:void(0)" onclick="navigate('user-list')" class="text-sm text-blue-600 underline">← กลับ</a>
  <div id="p_role_override_content" class="mt-3"></div>
</div>

<script src="../shared.js"></script>
<script>
function p_role_override_init() {
      notifyParentPage("role-override");
      const email = qparam("email");
      const overrides = db("role_overrides");
      const ov = overrides.find(o => o.email === email && o.active);
      document.getElementById("p_role_override_back-link").onclick = () => navigate("user-detail", {email: email});
      document.getElementById("p_role_override_content").innerHTML = `<div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-6 max-w-lg">
        <h1 class="text-lg font-bold text-gray-800 mb-1">กำหนดบทบาทพิเศษ (Role Override)</h1>
        <p class="text-xs text-gray-500 mb-4 font-mono">อีเมล: <span class="font-bold text-gray-800">${email}</span></p>
        <label class="text-sm font-semibold block mb-1 text-gray-700">บทบาทที่ต้องการกำหนด</label>
        <select id="p_role_override_f-role" class="border border-gray-300 rounded-xl px-3 py-2 mb-4 text-sm w-full bg-white focus:outline-none focus:ring-2 focus:ring-purple-300">
          <option value="student">นักศึกษา</option>
          <option value="staff">เจ้าหน้าที่</option>
        </select>
        <div class="flex items-center gap-2 pt-2 border-t border-gray-100">
          <button onclick="p_role_override_save('${email}')" class="bg-purple-600 hover:bg-purple-700 text-white text-sm font-semibold px-5 py-2 rounded-xl shadow-sm transition">บันทึก</button>
          ${ov ? `<button onclick="p_role_override_cancelOverride('${email}')" class="bg-white hover:bg-gray-50 border border-gray-300 text-gray-700 text-sm font-semibold px-4 py-2 rounded-xl transition">ยกเลิก Override (กลับไปใช้บทบาท SSO)</button>` : ""}
        </div>
      </div>`;
      if (ov) document.getElementById("p_role_override_f-role").value = ov.role;
    }
    function p_role_override_save(email) {
      const role = document.getElementById("p_role_override_f-role").value;
      const overrides = db("role_overrides");
      let ov = overrides.find(o => o.email === email);
      if (ov) { ov.role = role; ov.active = true; }
      else overrides.push({ email, role, active: true });
      dbSave("role_overrides", overrides);
      toastBanner("บันทึกบทบาท Role Override สำเร็จ มีผลตั้งแต่การเข้าสู่ระบบครั้งถัดไป");
      setTimeout(() => navigate("user-detail", {email: email}), 700);
    }
    function p_role_override_cancelOverride(email) {
      const overrides = db("role_overrides");
      const ov = overrides.find(o => o.email === email);
      if (ov) ov.active = false;
      dbSave("role_overrides", overrides);
      toastBanner("ยกเลิก Override แล้ว กลับไปใช้บทบาทอัตโนมัติจาก UBU SSO");
      setTimeout(() => navigate("user-detail", {email: email}), 700);
    }
</script>
</body>
</html>
