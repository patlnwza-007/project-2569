<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Bai+Jamjuree:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ['Sarabun', 'Thonburi', 'Bai Jamjuree', 'Inter', 'sans-serif'],
          heading: ['Sarabun', 'Thonburi', 'Space Grotesk', 'sans-serif'],
          mono: ['IBM Plex Mono', 'monospace'],
        }
      }
    }
  }
</script>
<style>
  html, body, button, input, select, textarea, div, p, span, h1, h2, h3, h4, h5, h6 {
    font-family: 'Sarabun', 'Thonburi', 'Bai Jamjuree', 'Inter', sans-serif !important;
  }
  .font-mono, code, pre { font-family: 'IBM Plex Mono', monospace !important; }
  .tab.active { border-bottom: 2px solid #2563eb; color: #2563eb; font-weight: 600; }
  html, body { margin: 0; height: 100%; }
</style>
<title>YuemDee · bulk-import</title>
</head>
<body class="bg-gray-50" onload="p_bulk_import_init()">

<div id="view-bulk-import" class="w-full h-full overflow-y-auto p-6">
<div class="max-w-xl mx-auto">
    <a href="javascript:void(0)" onclick="navigate('item-overview')" class="text-sm text-blue-600 hover:underline">← กลับภาพรวมคลัง</a>
    <h1 class="text-2xl font-bold text-gray-800 mt-2 mb-1">นำเข้าคลังแบบชุด (CSV)</h1>
    <p class="text-sm text-gray-500 mb-6">รูปแบบไฟล์: name,type(material/equipment),category_id,qty_total,max_borrow_days</p>

    <div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-6 space-y-4">
      <button onclick="p_bulk_import_downloadTemplate()" class="bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 text-sm font-semibold rounded-xl px-4 py-2">📥 ดาวน์โหลดไฟล์ต้นแบบ (template.csv)</button>
      <div>
        <label class="text-sm font-semibold text-gray-700">อัปโหลดไฟล์ CSV</label>
        <input id="p_bulk_import_file" type="file" accept=".csv" class="w-full mt-1 border border-gray-300 rounded-lg px-3 py-2 text-sm bg-white">
      </div>
      <button onclick="p_bulk_import_doImport()" class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold rounded-xl px-5 py-2">นำเข้าข้อมูล</button>
      <div id="p_bulk_import_result"></div>
    </div>
  </div>
</div>

<script src="../shared.js"></script>
<script>
function p_bulk_import_init() {
  notifyParentPage("bulk-import");
}

function p_bulk_import_downloadTemplate() {
      const csv = "name,type,category_id,qty_total,max_borrow_days\nตัวอย่าง จอมอนิเตอร์ 24 นิ้ว,equipment,1,5,7\nตัวอย่าง สมุดบันทึก,material,3,30,\n";
      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "template_import_item.csv"; a.click();
    }
    function p_bulk_import_doImport() {
      const fileInput = document.getElementById("p_bulk_import_file");
      const resultBox = document.getElementById("p_bulk_import_result");
      if (!fileInput.files.length) { toastBanner("กรุณาเลือกไฟล์ก่อน", "error"); return; }
      const reader = new FileReader();
      reader.onload = (e) => {
        const text = e.target.result;
        const lines = text.split(/\r?\n/).filter(l => l.trim() !== "");
        const header = lines.shift();
        const items = db("items");
        const errors = []; let ok = 0;
        lines.forEach((line, idx) => {
          const [name, type, catId, qty, days] = line.split(",").map(s => (s||"").trim());
          const rowNum = idx + 2;
          if (!name || !["material","equipment"].includes(type) || !catId || isNaN(Number(qty))) {
            errors.push(`แถวที่ ${rowNum}: รูปแบบไม่ถูกต้อง (${line})`); return;
          }
          items.push({ id: nextId(items), name, type, category_id: Number(catId), position_id: 1, qty_total: Number(qty), qty_available: Number(qty), max_borrow_days: type === "equipment" ? (Number(days)||7) : null, base_status: "พร้อมให้ยืม", image: "📦" });
          ok++;
        });
        dbSave("items", items);
        resultBox.innerHTML = `<div class="mt-2 text-sm">
          <p class="text-green-700 font-semibold">นำเข้าสำเร็จ ${ok} รายการ</p>
          ${errors.length ? `<p class="text-red-600 font-semibold mt-2">พบข้อผิดพลาด ${errors.length} แถว (ไม่ถูกนำเข้า):</p><ul class="list-disc list-inside text-xs text-red-500">${errors.map(e=>`<li>${e}</li>`).join("")}</ul>` : ""}
        </div>`;
        toastBanner(`นำเข้าสำเร็จ ${ok} รายการ`);
      };
      reader.readAsText(fileInput.files[0]);
    }
</script>
</body>
</html>
