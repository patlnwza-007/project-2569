<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Bai+Jamjuree:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ['Sarabun', 'Thonburi', 'Bai Jamjuree', 'Inter', 'sans-serif'],
          heading: ['Sarabun', 'Thonburi', 'Space Grotesk', 'sans-serif'],
          mono: ['IBM Plex Mono', 'monospace'],
        }
      }
    }
  }
</script>
<style>
  html, body, button, input, select, textarea, div, p, span, h1, h2, h3, h4, h5, h6 {
    font-family: 'Sarabun', 'Thonburi', 'Bai Jamjuree', 'Inter', sans-serif !important;
  }
  .font-mono, code, pre { font-family: 'IBM Plex Mono', monospace !important; }
  .tab.active { border-bottom: 2px solid #2563eb; color: #2563eb; font-weight: 600; }
  html, body { margin: 0; height: 100%; }
</style>
<title>YuemDee · request-form</title>
</head>
<body class="bg-gray-50" onload="p_request_form_init()">

<div id="view-request-form" class="w-full h-full overflow-y-auto p-6">
<div class="max-w-xl mx-auto">
    <h1 class="text-2xl font-bold text-gray-800 mb-1">ยืนยันส่งคำขอยืม</h1>
    <p class="text-sm text-gray-500 mb-6">กรอกเหตุผลการยืม</p>

    <div id="p_request_form_blocked-notice" class="hidden mb-4 bg-red-50 border border-red-300 text-red-700 rounded-xl p-4 text-sm"></div>

    <div id="p_request_form_form-box" class="bg-white rounded-2xl border border-gray-200 shadow-sm p-6 space-y-4">
      <div>
        <p class="text-sm font-semibold text-gray-700 mb-2">รายการที่จะยืม</p>
        <div id="p_request_form_summary" class="text-sm text-gray-600 bg-gray-50 rounded-lg p-3 space-y-1"></div>
      </div>
      <div>
        <label class="text-sm font-semibold text-gray-700">เหตุผลการยืม <span class="text-red-500">*</span></label>
        <textarea id="p_request_form_f-reason" rows="2" class="w-full mt-1 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300"></textarea>
        <p id="p_request_form_err-reason" class="hidden text-xs text-red-600 mt-1">กรุณาระบุเหตุผลการยืม</p>
      </div>
      <div class="flex gap-3 pt-2">
        <a href="javascript:void(0)" onclick="navigate('cart')" class="bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 text-sm font-semibold rounded-xl px-4 py-2">← แก้ไขตะกร้า</a>
        <button onclick="p_request_form_submitRequest()" class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold rounded-xl px-5 py-2">ยืนยันส่งคำขอ</button>
      </div>
    </div>
  </div>
</div>

<script src="../shared.js"></script>
<script>
function p_request_form_init() {
      notifyParentPage("request-form");
      const cart = db("cart");
      if (cart.length === 0) { navigate("cart"); return; }
      const stu = currentStudent();

      if (stu && !stu.phone) {
        navigate("profile", {return: "cart"});
        return;
      }
      if (stu && stu.blocked) {
        document.getElementById("p_request_form_form-box").classList.add("hidden");
        const box = document.getElementById("p_request_form_blocked-notice");
        box.classList.remove("hidden");
        box.innerHTML = `ไม่สามารถส่งคำขอยืมได้ เนื่องจากบัญชีของคุณถูกระงับสิทธิ์การยืม (Block)<br><span class="text-xs">เหตุผล: ${stu.block_reason}</span>`;
        return;
      }

      document.getElementById("p_request_form_summary").innerHTML = cart.map(c => {
        const i = itemById(c.item_id);
        return `<div>${i.image} ${i.name} × ${c.qty} <span class="text-xs text-gray-400">(${i.type === 'equipment' ? 'ครุภัณฑ์' : 'วัสดุ'})</span></div>`;
      }).join("");
    }

    function p_request_form_submitRequest() {
      const reason = document.getElementById("p_request_form_f-reason").value.trim();
      let ok = true;
      if (!reason) { document.getElementById("p_request_form_err-reason").classList.remove("hidden"); ok = false; }
      else document.getElementById("p_request_form_err-reason").classList.add("hidden");
      if (!ok) return;

      const cart = db("cart");
      const reqs = db("requests");
      reqs.push({
        id: nextId(reqs), student_id: currentUserId(),
        items: cart.map(c => ({ item_id: c.item_id, qty: c.qty })),
        reason, use_date: null,
        status: "PENDING", created_at: "2026-07-23 " + new Date().toTimeString().slice(0,5),
        approved_at: null, reject_reason: "",
      });
      dbSave("requests", reqs);
      dbSave("cart", []);
      toastBanner("ส่งคำขอยืมสำเร็จ สถานะ: รออนุมัติ");
      setTimeout(() => navigate("request-list"), 700);
    }
</script>
</body>
</html>
