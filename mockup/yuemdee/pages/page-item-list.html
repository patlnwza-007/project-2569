<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Bai+Jamjuree:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ['Sarabun', 'Thonburi', 'Bai Jamjuree', 'Inter', 'sans-serif'],
          heading: ['Sarabun', 'Thonburi', 'Space Grotesk', 'sans-serif'],
          mono: ['IBM Plex Mono', 'monospace'],
        }
      }
    }
  }
</script>
<style>
  html, body, button, input, select, textarea, div, p, span, h1, h2, h3, h4, h5, h6 {
    font-family: 'Sarabun', 'Thonburi', 'Bai Jamjuree', 'Inter', sans-serif !important;
  }
  .font-mono, code, pre { font-family: 'IBM Plex Mono', monospace !important; }
  .tab.active { border-bottom: 2px solid #2563eb; color: #2563eb; font-weight: 600; }
  html, body { margin: 0; height: 100%; }
</style>
<title>YuemDee · item-list</title>
</head>
<body class="bg-gray-50" onload="p_item_list_init()">

<div id="view-item-list" class="w-full h-full overflow-y-auto p-6">
  <div class="max-w-7xl mx-auto">
    <!-- Header Title -->
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-3 mb-6">
      <div>
        <h1 class="text-2xl font-bold text-gray-900 tracking-tight flex items-center gap-2">
          <span>📦</span> รายการวัสดุและครุภัณฑ์
        </h1>
        <p class="text-sm text-gray-500 mt-1">สำรวจสิ่งของทั้งหมดในคลัง ค้นหา กรอง และส่งคำขอยืมออนไลน์ได้ง่ายๆ</p>
      </div>
      <div class="flex items-center gap-2 md:hidden">
        <a href="javascript:void(0)" onclick="navigate('cart')" class="inline-flex items-center gap-2 bg-blue-50 border border-blue-200 hover:bg-blue-100 text-blue-700 font-medium text-sm rounded-xl px-4 py-2.5 transition-colors shadow-sm">
          <span>🛒</span>
          <span>ตะกร้ายืมของ</span>
          <span id="p_item_list_cart_badge" class="bg-blue-600 text-white text-xs font-bold px-2 py-0.5 rounded-full">0</span>
        </a>
      </div>
    </div>

    <!-- Controls & Filter Toolbar -->
    <div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-4 mb-5">
      <div class="flex flex-wrap gap-3 items-end">
        <!-- Search Input -->
        <div class="flex-1 min-w-[220px]">
          <label class="text-xs font-semibold text-gray-500 mb-1 block">🔍 ค้นหาชื่อสิ่งของ</label>
          <input id="p_item_list_q" oninput="p_item_list_render()" placeholder="พิมพ์ชื่อ เช่น โปรเจกเตอร์, สาย HDMI..." class="w-full border border-gray-300 rounded-xl px-3.5 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all">
        </div>

        <!-- Filter Dropdowns -->
        <div class="min-w-[140px]">
          <label class="text-xs font-semibold text-gray-500 mb-1 block">🏷️ หมวดหมู่</label>
          <select id="p_item_list_f-cat" onchange="p_item_list_render()" class="w-full border border-gray-300 rounded-xl px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500">
            <option value="">ทั้งหมด</option>
          </select>
        </div>

        <div class="min-w-[120px]">
          <label class="text-xs font-semibold text-gray-500 mb-1 block">📦 ประเภท</label>
          <select id="p_item_list_f-type" onchange="p_item_list_render()" class="w-full border border-gray-300 rounded-xl px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500">
            <option value="">ทั้งหมด</option>
            <option value="material">วัสดุ</option>
            <option value="equipment">ครุภัณฑ์</option>
          </select>
        </div>

        <div class="min-w-[130px]">
          <label class="text-xs font-semibold text-gray-500 mb-1 block">⚡ สถานะ</label>
          <select id="p_item_list_f-status" onchange="p_item_list_render()" class="w-full border border-gray-300 rounded-xl px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500">
            <option value="">ทั้งหมด</option>
            <option value="available">พร้อมให้ยืม</option>
            <option value="empty">ถูกยืมหมด</option>
            <option value="unavailable">ไม่พร้อมใช้งาน</option>
          </select>
        </div>

        <!-- Sorting -->
        <div class="min-w-[150px]">
          <label class="text-xs font-semibold text-gray-500 mb-1 block">↕️ เรียงลำดับ</label>
          <select id="p_item_list_sort" onchange="p_item_list_render()" class="w-full border border-gray-300 rounded-xl px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500">
            <option value="qty-desc">จำนวนคงเหลือมากสุด</option>
            <option value="qty-asc">จำนวนคงเหลือน้อยสุด</option>
            <option value="name-asc">ชื่อสิ่งของ (ก-ฮ)</option>
            <option value="days-desc">ยืมได้นานที่สุด</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Status & Results Counter Bar -->
    <div class="flex items-center justify-between px-1 mb-4 text-xs font-semibold text-gray-500">
      <div id="p_item_list_counter">กำลังโหลดข้อมูล...</div>
      <div class="hidden sm:flex items-center gap-3">
        <span class="inline-flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-emerald-500"></span>พร้อมให้ยืม</span>
        <span class="inline-flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-red-500"></span>ถูกยืมหมด (จองคิวได้)</span>
        <span class="inline-flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-gray-400"></span>ชำรุด/งดให้ยืม</span>
      </div>
    </div>

    <!-- Main Grid Host Container -->
    <div id="p_item_list_grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4"></div>
  </div>
</div>

<script src="../shared.js"></script>
<script>
let p_item_list_view_mode = "grid"; // "grid" | "compact" | "list"
let p_item_list_quick_tag = "all"; // "all" | "available" | "equipment" | "material"

function p_item_list_init() {
  notifyParentPage("item-list");
  const catSelect = document.getElementById("p_item_list_f-cat");
  if (catSelect) {
    catSelect.innerHTML = '<option value="">ทั้งหมด</option>' + db("categories").map(c => `<option value="${c.id}">${c.name}</option>`).join("");
  }
  p_item_list_updateCartBadge();
  p_item_list_render();
}

function p_item_list_updateCartBadge() {
  const badge = document.getElementById("p_item_list_cart_badge");
  if (!badge) return;
  const cart = db("cart");
  const totalCount = cart.reduce((sum, item) => sum + (item.qty || 1), 0);
  badge.innerText = totalCount;
}

function p_item_list_setQuickTag(tag) {
  p_item_list_quick_tag = tag;
  const tags = ["all", "available", "equipment", "material"];
  tags.forEach(t => {
    const btn = document.getElementById(`p_item_list_tag_${t}`);
    if (btn) {
      if (t === tag) {
        btn.className = "tag-btn text-xs font-semibold px-3.5 py-1.5 rounded-full border border-blue-600 bg-blue-600 text-white transition-all shadow-sm";
      } else {
        btn.className = "tag-btn text-xs font-semibold px-3.5 py-1.5 rounded-full border border-gray-200 bg-white text-gray-700 hover:bg-gray-100 transition-all";
      }
    }
  });
  p_item_list_render();
}

function p_item_list_setViewMode(mode) {
  p_item_list_view_mode = mode;
  const modes = ["grid", "compact", "list"];
  modes.forEach(m => {
    const btn = document.getElementById(`p_item_list_btn_${m}`);
    if (btn) {
      if (m === mode) {
        btn.className = "p-1.5 rounded-lg text-xs font-semibold bg-white text-blue-600 shadow-sm border border-gray-200/80 transition-all";
      } else {
        btn.className = "p-1.5 rounded-lg text-xs font-semibold text-gray-600 hover:text-gray-900 transition-all";
      }
    }
  });
  p_item_list_render();
}

function p_item_list_render() {
  const q = document.getElementById("p_item_list_q") ? document.getElementById("p_item_list_q").value.trim().toLowerCase() : "";
  const fCat = document.getElementById("p_item_list_f-cat") ? document.getElementById("p_item_list_f-cat").value : "";
  const fType = document.getElementById("p_item_list_f-type") ? document.getElementById("p_item_list_f-type").value : "";
  const fStatus = document.getElementById("p_item_list_f-status") ? document.getElementById("p_item_list_f-status").value : "";
  const sortVal = document.getElementById("p_item_list_sort") ? document.getElementById("p_item_list_sort").value : "qty-desc";

  let items = db("items");

  // Apply Quick Filter Tags
  if (p_item_list_quick_tag === "available") {
    items = items.filter(i => i.base_status === "พร้อมให้ยืม" && i.qty_available > 0);
  } else if (p_item_list_quick_tag === "equipment") {
    items = items.filter(i => i.type === "equipment");
  } else if (p_item_list_quick_tag === "material") {
    items = items.filter(i => i.type === "material");
  }

  // Apply Search and Dropdown Filters
  if (q) items = items.filter(i => i.name.toLowerCase().includes(q));
  if (fCat) items = items.filter(i => i.category_id === Number(fCat));
  if (fType) items = items.filter(i => i.type === fType);
  if (fStatus === "available") items = items.filter(i => i.base_status === "พร้อมให้ยืม" && i.qty_available > 0);
  if (fStatus === "empty") items = items.filter(i => i.base_status === "พร้อมให้ยืม" && i.qty_available === 0);
  if (fStatus === "unavailable") items = items.filter(i => i.base_status !== "พร้อมให้ยืม");

  // Apply Sorting
  if (sortVal === "qty-desc") {
    items.sort((a, b) => b.qty_available - a.qty_available);
  } else if (sortVal === "qty-asc") {
    items.sort((a, b) => a.qty_available - b.qty_available);
  } else if (sortVal === "name-asc") {
    items.sort((a, b) => a.name.localeCompare(b.name, "th"));
  } else if (sortVal === "days-desc") {
    items.sort((a, b) => (b.max_borrow_days || 0) - (a.max_borrow_days || 0));
  }

  // Counter update
  const counterEl = document.getElementById("p_item_list_counter");
  if (counterEl) {
    counterEl.innerHTML = `แสดงทั้งหมด <span class="font-bold text-gray-800 font-mono">${items.length}</span> จาก ${db("items").length} รายการ`;
  }

  const host = document.getElementById("p_item_list_grid");
  if (!host) return;

  if (db("items").length === 0) { host.innerHTML = p_item_list_emptyState("ยังไม่มีรายการสิ่งของในคลัง"); return; }
  if (items.length === 0) { host.innerHTML = p_item_list_emptyState("ไม่พบรายการสิ่งของที่ตรงกับเงื่อนไขการค้นหา"); return; }

  // Set grid host container styling according to active view mode
  if (p_item_list_view_mode === "grid") {
    host.className = "grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4.5";
  } else if (p_item_list_view_mode === "compact") {
    host.className = "grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 xl:grid-cols-6 gap-3";
  } else if (p_item_list_view_mode === "list") {
    host.className = "flex flex-col gap-3";
  }

  p_item_list_updateCartBadge();

  host.innerHTML = items.map(i => {
    const cat = categoryById(i.category_id);
    const pos = positionById(i.position_id);
    const unavailable = i.base_status !== "พร้อมให้ยืม";
    const empty = !unavailable && i.qty_available === 0;

    let statusBadge = unavailable
      ? `<span class="inline-flex items-center gap-1 rounded-full px-2.5 py-0.5 text-xs font-semibold bg-gray-100 text-gray-600 border border-gray-200">🔴 ไม่พร้อมใช้งาน</span>`
      : empty
      ? `<span class="inline-flex items-center gap-1 rounded-full px-2.5 py-0.5 text-xs font-semibold bg-red-50 text-red-700 border border-red-200">⏳ ถูกยืมหมด</span>`
      : `<span class="inline-flex items-center gap-1 rounded-full px-2.5 py-0.5 text-xs font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200">✅ พร้อมยืม</span>`;

    const typeTag = i.type === 'equipment' 
      ? `<span class="bg-indigo-50 text-indigo-700 border border-indigo-100 text-[10px] font-semibold px-2 py-0.5 rounded-md">ครุภัณฑ์</span>`
      : `<span class="bg-teal-50 text-teal-700 border border-teal-100 text-[10px] font-semibold px-2 py-0.5 rounded-md">วัสดุเบิกใช้</span>`;

    // Stock ratio
    const stockPct = Math.min(100, Math.round((i.qty_available / Math.max(1, i.qty_total)) * 100));
    const progressColor = empty ? 'bg-red-500' : stockPct < 30 ? 'bg-amber-500' : 'bg-emerald-500';

    // --- RENDER COMPACT GRID ---
    if (p_item_list_view_mode === "compact") {
      return `<div class="group bg-white rounded-xl border border-gray-200 p-3 hover:border-blue-400 hover:shadow-md transition-all cursor-pointer flex flex-col justify-between" onclick="navigate('item-detail', {id: ${i.id}})">
        <div>
          <div class="flex items-center justify-between mb-2">
            <div class="w-10 h-10 rounded-lg bg-blue-50 flex items-center justify-center text-2xl group-hover:scale-110 transition-transform">${i.image}</div>
            <span class="text-[11px] font-bold font-mono ${empty ? 'text-red-600' : 'text-emerald-600'}">${i.qty_available}/${i.qty_total}</span>
          </div>
          <h3 class="font-semibold text-gray-800 text-xs line-clamp-2 leading-tight mb-1 group-hover:text-blue-600 transition-colors">${i.name}</h3>
          <p class="text-[10px] text-gray-400 truncate">${cat ? cat.name : ''}</p>
        </div>
        <div class="mt-2.5 pt-2 border-t border-gray-100" onclick="event.stopPropagation()">
          ${unavailable ? `<span class="text-[10px] text-gray-400 font-medium">ไม่พร้อมยืม</span>` : empty
            ? `<button onclick="p_item_list_joinQueue(${i.id})" class="w-full bg-amber-400 hover:bg-amber-500 text-amber-950 text-[11px] font-semibold rounded-lg px-2 py-1 transition-colors">จองคิว</button>`
            : `<button onclick="p_item_list_addToCart(${i.id})" class="w-full bg-blue-600 hover:bg-blue-700 text-white text-[11px] font-semibold rounded-lg px-2 py-1 transition-colors">+ เพิ่ม</button>`}
        </div>
      </div>`;
    }

    // --- RENDER LIST VIEW ---
    if (p_item_list_view_mode === "list") {
      return `<div class="bg-white rounded-xl border border-gray-200 p-3.5 hover:border-blue-300 hover:shadow-md transition-all cursor-pointer flex flex-col sm:flex-row sm:items-center justify-between gap-3" onclick="navigate('item-detail', {id: ${i.id}})">
        <div class="flex items-center gap-3.5 flex-1 min-w-0">
          <div class="w-12 h-12 shrink-0 rounded-xl bg-gradient-to-br from-blue-50 to-indigo-50 border border-blue-100 flex items-center justify-center text-2xl shadow-inner">${i.image}</div>
          <div class="min-w-0 flex-1">
            <div class="flex items-center gap-2 mb-0.5 flex-wrap">
              <h3 class="font-semibold text-gray-900 text-sm hover:text-blue-600 transition-colors truncate">${i.name}</h3>
              ${typeTag}
              ${statusBadge}
            </div>
            <div class="flex items-center gap-3 text-xs text-gray-500 flex-wrap">
              <span>🏷️ ${cat ? cat.name : '-'}</span>
              <span>📍 ${pos ? pos.name : 'ตู้ A'}</span>
              ${i.max_borrow_days ? `<span class="text-indigo-600 font-medium">⏱️ สูงสุด ${i.max_borrow_days} วัน</span>` : ''}
            </div>
          </div>
        </div>

        <div class="flex items-center justify-between sm:justify-end gap-4 shrink-0 pt-2 sm:pt-0 border-t sm:border-0 border-gray-100" onclick="event.stopPropagation()">
          <div class="text-right">
            <div class="text-xs text-gray-500">คงเหลือ <span class="font-mono font-bold text-gray-900 text-sm">${i.qty_available}</span> / ${i.qty_total}</div>
            <div class="w-24 bg-gray-100 rounded-full h-1.5 mt-1 overflow-hidden">
              <div class="${progressColor} h-1.5 rounded-full" style="width: ${stockPct}%"></div>
            </div>
          </div>
          <div class="min-w-[110px]">
            ${unavailable ? `<span class="text-xs text-gray-400 font-medium block text-center">งดให้บริการ</span>` : empty
              ? `<button onclick="p_item_list_joinQueue(${i.id})" class="w-full bg-amber-400 hover:bg-amber-500 text-amber-950 text-xs font-semibold rounded-lg px-3 py-2 transition-colors">จองคิว</button>`
              : `<button onclick="p_item_list_addToCart(${i.id})" class="w-full bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold rounded-lg px-3 py-2 transition-colors flex items-center justify-center gap-1"><span>+</span> เพิ่มลงตะกร้า</button>`}
          </div>
        </div>
      </div>`;
    }

    // --- RENDER STANDARD GRID CARD (DEFAULT) ---
    return `<div class="group bg-white rounded-2xl border border-gray-200 shadow-sm hover:shadow-xl hover:border-blue-300 transition-all duration-200 p-4 cursor-pointer flex flex-col justify-between relative overflow-hidden" onclick="navigate('item-detail', {id: ${i.id}})">
      <div>
        <!-- Card Header: Image & Badge -->
        <div class="flex items-start justify-between gap-2 mb-3">
          <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-blue-50 via-gray-50 to-indigo-50 border border-gray-100 flex items-center justify-center text-3xl group-hover:scale-105 transition-transform shadow-inner">
            ${i.image}
          </div>
          <div class="flex flex-col items-end gap-1">
            ${statusBadge}
            ${typeTag}
          </div>
        </div>

        <!-- Card Title & Category -->
        <h3 class="font-bold text-gray-800 text-base leading-snug group-hover:text-blue-600 transition-colors line-clamp-1 mb-1">
          ${i.name}
        </h3>
        <p class="text-xs text-gray-400 mb-3 flex items-center gap-1">
          <span>🏷️ ${cat ? cat.name : "หมวดทั่วไป"}</span>
        </p>

        <!-- Details Badges -->
        <div class="grid grid-cols-2 gap-2 text-xs bg-gray-50/80 rounded-xl p-2.5 mb-3 border border-gray-100">
          <div>
            <span class="text-[10px] text-gray-400 block font-semibold uppercase tracking-wider">ตำแหน่งจัดเก็บ</span>
            <span class="text-gray-700 font-medium truncate block">📍 ${pos ? pos.name : "ตู้จัดเก็บ"}</span>
          </div>
          <div>
            <span class="text-[10px] text-gray-400 block font-semibold uppercase tracking-wider">ระยะเวลายืม</span>
            <span class="text-gray-700 font-medium block">
              ${i.max_borrow_days ? `⏱️ สูงสุด ${i.max_borrow_days} วัน` : '♾️ เบิกใช้'}
            </span>
          </div>
        </div>

        <!-- Stock Bar Indicator -->
        <div class="mb-3">
          <div class="flex justify-between items-center text-xs mb-1">
            <span class="text-gray-500 font-medium">จำนวนในคลัง</span>
            <span class="font-mono text-xs"><strong class="text-gray-800 text-sm font-bold">${i.qty_available}</strong> / ${i.qty_total} ชิ้น</span>
          </div>
          <div class="w-full bg-gray-100 rounded-full h-2 overflow-hidden p-0.5">
            <div class="${progressColor} h-1.5 rounded-full transition-all duration-300" style="width: ${stockPct}%"></div>
          </div>
        </div>
      </div>

      <!-- Action Footer -->
      <div class="pt-2 border-t border-gray-100 mt-1" onclick="event.stopPropagation()">
        ${unavailable 
          ? `<button disabled class="w-full bg-gray-100 text-gray-400 text-xs font-semibold rounded-xl px-3 py-2 cursor-not-allowed">ไม่พร้อมให้บริการ</button>` 
          : empty
          ? `<button onclick="p_item_list_joinQueue(${i.id})" class="w-full bg-amber-400 hover:bg-amber-500 active:scale-[0.98] text-amber-950 text-xs font-bold rounded-xl px-3 py-2.5 shadow-sm transition-all flex items-center justify-center gap-1.5">
              <span>⏳</span> จองคิวล่วงหน้า
            </button>`
          : `<button onclick="p_item_list_addToCart(${i.id})" class="w-full bg-blue-600 hover:bg-blue-700 active:scale-[0.98] text-white text-xs font-bold rounded-xl px-3 py-2.5 shadow-sm hover:shadow-blue-200 transition-all flex items-center justify-center gap-1.5">
              <span>+</span> เพิ่มลงตะกร้ายืม
            </button>`}
      </div>
    </div>`;
  }).join("");
}

function p_item_list_addToCart(id) {
  const cart = db("cart");
  const existing = cart.find(c => c.item_id === id);
  const item = itemById(id);
  if (!item) return;
  if (existing) {
    if (existing.qty < item.qty_available) {
      existing.qty += 1;
      toastBanner(`เพิ่ม "${item.name}" ในตะกร้าเป็น ${existing.qty} ชิ้นแล้ว`);
    } else {
      toastBanner(`ไม่สามารถเพิ่มได้เกินจำนวนที่คงเหลือ (${item.qty_available} ชิ้น)`, "error");
      return;
    }
  } else {
    cart.push({ item_id: id, qty: 1 });
    toastBanner(`เพิ่ม "${item.name}" ลงตะกร้าแล้ว`);
  }
  dbSave("cart", cart);
  p_item_list_updateCartBadge();
}

function p_item_list_joinQueue(id) {
  const queue = db("queue");
  const stu = currentUserId();
  if (queue.some(q => q.item_id === id && q.student_id === stu)) {
    toastBanner("คุณอยู่ในคิวของสิ่งของนี้แล้ว", "error"); return;
  }
  queue.push({ id: nextId(queue), item_id: id, student_id: stu, joined_at: "2026-07-23 " + new Date().toTimeString().slice(0,5) });
  dbSave("queue", queue);
  const myPos = queue.filter(q => q.item_id === id).findIndex(q => q.student_id === stu) + 1;
  toastBanner(`จองคิวสำเร็จ คุณอยู่ลำดับที่ ${myPos}`);
}

function p_item_list_emptyState(title) {
  return `<div class="col-span-full bg-white rounded-2xl border border-dashed border-gray-300 p-10 text-center">
    <div class="text-4xl mb-2">📭</div><p class="text-gray-600 font-semibold">${title}</p>
  </div>`;
}
</script>
