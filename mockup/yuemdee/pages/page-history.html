<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Bai+Jamjuree:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ['Sarabun', 'Thonburi', 'Bai Jamjuree', 'Inter', 'sans-serif'],
          heading: ['Sarabun', 'Thonburi', 'Space Grotesk', 'sans-serif'],
          mono: ['IBM Plex Mono', 'monospace'],
        }
      }
    }
  }
</script>
<style>
  html, body, button, input, select, textarea, div, p, span, h1, h2, h3, h4, h5, h6 {
    font-family: 'Sarabun', 'Thonburi', 'Bai Jamjuree', 'Inter', sans-serif !important;
  }
  .font-mono, code, pre { font-family: 'IBM Plex Mono', monospace !important; }
  .tab.active { border-bottom: 2px solid #2563eb; color: #2563eb; font-weight: 600; }
  html, body { margin: 0; height: 100%; }
</style>
<title>YuemDee · history</title>
</head>
<body class="bg-gray-50" onload="p_history_init()">

<div id="view-history" class="w-full h-full overflow-y-auto p-6">
<div class="max-w-4xl mx-auto">
    <h1 class="text-2xl font-bold text-gray-800 mb-1">ประวัติการยืม</h1>
    <p class="text-sm text-gray-500 mb-6">รายการยืม-คืนทั้งหมดของคุณ เรียงตามวันที่ล่าสุด</p>
    <div class="bg-white rounded-2xl border border-gray-200 shadow-sm overflow-hidden">
      <table class="w-full text-sm">
        <thead class="bg-gray-50 text-xs uppercase tracking-wider text-gray-500">
          <tr><th class="text-left px-4 py-2">#</th><th class="text-left px-4 py-2">รายการ</th><th class="text-left px-4 py-2">วันที่ส่งคำขอ</th><th class="text-left px-4 py-2">สถานะ</th><th class="text-left px-4 py-2">ประเมิน</th></tr>
        </thead>
        <tbody id="p_history_rows"></tbody>
      </table>
      <div id="p_history_empty" class="hidden p-10 text-center text-gray-500"><div class="text-4xl mb-2">📜</div>ยังไม่มีประวัติการยืม</div>
    </div>
  </div>
</div>

<script src="../shared.js"></script>
<script>
function p_history_init() {
      notifyParentPage("history");
      const stu = currentUserId();
      const reqs = db("requests").filter(r => r.student_id === stu).sort((a,b)=> (b.created_at||"").localeCompare(a.created_at||""));
      const evals = db("eval_responses");
      const host = document.getElementById("p_history_rows");
      if (reqs.length === 0) { document.getElementById("p_history_empty").classList.remove("hidden"); return; }
      host.innerHTML = reqs.map(r => {
        const names = r.items.map(it => itemById(it.item_id)?.name).join(", ");
        const evaluated = evals.some(e => e.request_id === r.id);
        let evalCell = "-";
        if (r.status === "RETURNED") {
          evalCell = evaluated ? `<span class="text-green-600 text-xs">ประเมินแล้ว</span>` : `<a href="javascript:void(0)" onclick="navigate('evaluation', {rid: ${r.id}})" class="text-blue-600 text-xs hover:underline">ประเมินเลย</a>`;
        }
        return `<tr class="hover:bg-gray-50 border-t border-gray-100">
          <td class="px-4 py-2 font-mono text-xs">#${r.id}</td>
          <td class="px-4 py-2">${names}</td>
          <td class="px-4 py-2 text-xs text-gray-500">${r.created_at}</td>
          <td class="px-4 py-2">${badgeHtml(r.status)}</td>
          <td class="px-4 py-2">${evalCell}</td>
        </tr>`;
      }).join("");
    }
</script>
</body>
</html>
