<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Bai+Jamjuree:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ['Sarabun', 'Thonburi', 'Bai Jamjuree', 'Inter', 'sans-serif'],
          heading: ['Sarabun', 'Thonburi', 'Space Grotesk', 'sans-serif'],
          mono: ['IBM Plex Mono', 'monospace'],
        }
      }
    }
  }
</script>
<style>
  html, body, button, input, select, textarea, div, p, span, h1, h2, h3, h4, h5, h6 {
    font-family: 'Sarabun', 'Thonburi', 'Bai Jamjuree', 'Inter', sans-serif !important;
  }
  .font-mono, code, pre { font-family: 'IBM Plex Mono', monospace !important; }
  .tab.active { border-bottom: 2px solid #2563eb; color: #2563eb; font-weight: 600; }
  html, body { margin: 0; height: 100%; }
</style>
<title>YuemDee · item-status-change</title>
</head>
<body class="bg-gray-50" onload="p_item_status_change_init()">

<div id="view-item-status-change" class="w-full h-full overflow-y-auto p-6">
<div class="max-w-xl mx-auto">
    <a href="javascript:void(0)" onclick="navigate('item-overview')" class="text-sm text-blue-600 hover:underline">← กลับภาพรวมคลัง</a>
    <div id="p_item_status_change_content" class="mt-3"></div>
  </div>
</div>

<script src="../shared.js"></script>
<script>
function p_item_status_change_init() {
  notifyParentPage("item-status-change");
  const id = Number(qparam("id"));
  const item = itemById(id);
  const host = document.getElementById("p_item_status_change_content");
  if (!item) { host.innerHTML = `<div class="bg-white rounded-2xl border p-8 text-center text-gray-500">ไม่พบสิ่งของนี้</div>`; return; }

  const units = db("units").filter(u => u.item_id === id);

  const unitBadges = {
    AVAILABLE: `<span class="bg-emerald-100 text-emerald-700 px-2.5 py-0.5 rounded-full text-xs font-semibold">✅ พร้อมใช้งาน</span>`,
    BORROWED: `<span class="bg-indigo-100 text-indigo-700 px-2.5 py-0.5 rounded-full text-xs font-semibold">📦 กำลังถูกยืม</span>`,
    DAMAGED: `<span class="bg-red-100 text-red-700 px-2.5 py-0.5 rounded-full text-xs font-semibold">⚠️ ชำรุด</span>`,
    MAINTENANCE: `<span class="bg-amber-100 text-amber-700 px-2.5 py-0.5 rounded-full text-xs font-semibold">🛠️ ส่งซ่อม</span>`,
  };

  const unitsListHtml = units.length === 0 ? `<p class="text-xs text-gray-400">ไม่มีข้อมูลรหัสประจำชิ้นในระบบ</p>` : units.map(u => {
    return `<div class="bg-gray-50 rounded-xl border border-gray-200 p-3.5 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
      <div>
        <div class="flex items-center gap-2">
          <span class="font-mono font-bold text-sm text-gray-900">${u.asset_tag}</span>
          ${unitBadges[u.status] || unitBadges.AVAILABLE}
        </div>
        ${u.note ? `<p class="text-xs text-red-600 font-medium mt-1">📝 หมายเหตุ: ${u.note}</p>` : ''}
      </div>
      <div class="flex items-center gap-2 shrink-0">
        <select id="u_status_${u.asset_tag.replace(/-/g,'_')}" class="border border-gray-300 rounded-lg text-xs px-2.5 py-1.5 bg-white focus:outline-none focus:ring-2 focus:ring-blue-300">
          <option value="AVAILABLE" ${u.status==='AVAILABLE'?'selected':''}>พร้อมใช้งาน</option>
          <option value="BORROWED" ${u.status==='BORROWED'?'selected':''}>กำลังถูกยืม</option>
          <option value="DAMAGED" ${u.status==='DAMAGED'?'selected':''}>ชำรุด</option>
          <option value="MAINTENANCE" ${u.status==='MAINTENANCE'?'selected':''}>ส่งซ่อมคลัง</option>
        </select>
        <button onclick="p_item_status_change_saveUnit('${u.asset_tag}', ${id})" class="bg-blue-600 hover:bg-blue-700 active:scale-[0.98] text-white text-xs font-semibold rounded-lg px-3.5 py-1.5 transition-all shadow-sm">
          บันทึก
        </button>
      </div>
    </div>`;
  }).join("");

  host.innerHTML = `<div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-6 space-y-4">
    <div class="flex items-center justify-between border-b border-gray-100 pb-4">
      <div>
        <h1 class="text-xl font-bold text-gray-900 flex items-center gap-2">
          <span>${item.image}</span>
          <span>${item.name}</span>
        </h1>
        <p class="text-xs text-gray-500 mt-0.5">จัดการรหัสประจำชิ้น (Asset Tag / Serial Number) และสถานะความพร้อมใช้งานรายชิ้น</p>
      </div>
      <span class="text-xs font-mono bg-blue-50 text-blue-700 font-bold px-3 py-1.5 rounded-full border border-blue-200">
        คงเหลือ: ${item.qty_available} / ${item.qty_total} ชิ้น
      </span>
    </div>

    <div>
      <h3 class="text-sm font-bold text-gray-800 mb-3 flex items-center gap-1.5">
        <span>🏷️</span> รายการครุภัณฑ์รายชิ้นในคลัง (${units.length} ชิ้น)
      </h3>
      <div class="space-y-2.5 max-h-96 overflow-y-auto pr-1">${unitsListHtml}</div>
    </div>
  </div>`;
}

function p_item_status_change_saveUnit(assetTag, itemId) {
  const selectId = `u_status_${assetTag.replace(/-/g,'_')}`;
  const newStatus = document.getElementById(selectId)?.value;
  if (!newStatus) return;

  const units = db("units");
  const u = units.find(x => x.asset_tag === assetTag);
  if (u) {
    u.status = newStatus;
    if (newStatus === "AVAILABLE") u.note = "";
    else if (newStatus === "DAMAGED" && !u.note) u.note = "เจ้าหน้าที่ตรวจพบการชำรุดในคลัง";
    dbSave("units", units);

    // Recalculate item available qty
    const items = db("items");
    const item = items.find(i => i.id === itemId);
    if (item) {
      const availUnits = units.filter(x => x.item_id === itemId && x.status === "AVAILABLE").length;
      item.qty_available = availUnits;
      if (availUnits === 0 && item.qty_total > 0) item.base_status = "ไม่พร้อมใช้งาน";
      else item.base_status = "พร้อมให้ยืม";
      dbSave("items", items);
    }

    toastBanner(`อัปเดตสถานะรหัส ${assetTag} เป็น "${newStatus}" สำเร็จ`);
    p_item_status_change_init();
  }
}
</script>
</body>
</html>
