<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Bai+Jamjuree:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ['Sarabun', 'Thonburi', 'Bai Jamjuree', 'Inter', 'sans-serif'],
          heading: ['Sarabun', 'Thonburi', 'Space Grotesk', 'sans-serif'],
          mono: ['IBM Plex Mono', 'monospace'],
        }
      }
    }
  }
</script>
<style>
  html, body, button, input, select, textarea, div, p, span, h1, h2, h3, h4, h5, h6 {
    font-family: 'Sarabun', 'Thonburi', 'Bai Jamjuree', 'Inter', sans-serif !important;
  }
  .font-mono, code, pre { font-family: 'IBM Plex Mono', monospace !important; }
  .tab.active { border-bottom: 2px solid #2563eb; color: #2563eb; font-weight: 600; }
  html, body { margin: 0; height: 100%; }
</style>
<title>YuemDee · purchase-add</title>
</head>
<body class="bg-gray-50" onload="p_purchase_add_init()">

<div id="view-purchase-add" class="w-full h-full overflow-y-auto p-6">
<div class="max-w-2xl mx-auto">
    <h1 class="text-2xl font-bold text-gray-800 mb-1">รายการจัดซื้อ</h1>
    <p class="text-sm text-gray-500 mb-6">เพิ่มรายการสิ่งของที่ต้องการจัดซื้อด้วยตนเอง (นอกเหนือจากคำเสนอแนะของนักศึกษา)</p>
    <div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-6 mb-6 space-y-3">
      <div><label class="text-sm font-semibold text-gray-700">ชื่อสิ่งของ <span class="text-red-500">*</span></label>
        <input id="p_purchase_add_f-name" class="w-full mt-1 border border-gray-300 rounded-lg px-3 py-2 text-sm"></div>
      <div><label class="text-sm font-semibold text-gray-700">รายละเอียด</label>
        <textarea id="p_purchase_add_f-detail" rows="2" class="w-full mt-1 border border-gray-300 rounded-lg px-3 py-2 text-sm"></textarea></div>
      <button onclick="p_purchase_add_add()" class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold rounded-xl px-4 py-2">เพิ่มรายการ</button>
    </div>
    <h2 class="text-sm font-bold text-gray-700 mb-2">รายการทั้งหมด</h2>
    <div id="p_purchase_add_rows" class="space-y-2"></div>
  </div>
</div>

<script src="../shared.js"></script>
<script>
function p_purchase_add_init() { notifyParentPage("purchase-add"); p_purchase_add_render(); }
    function p_purchase_add_render() {
      const list = db("purchases").slice().sort((a,b)=>(b.created_at||"").localeCompare(a.created_at||""));
      document.getElementById("p_purchase_add_rows").innerHTML = list.map(p => `<div class="bg-white rounded-xl border border-gray-200 p-3 text-sm">
        <p class="font-semibold text-gray-800">${p.name}</p><p class="text-xs text-gray-500">${p.detail || ""}</p>
        <p class="text-xs text-gray-400 mt-1">เพิ่มเมื่อ ${p.created_at}</p></div>`).join("") || `<p class="text-xs text-gray-400">ยังไม่มีรายการจัดซื้อ</p>`;
    }
    function p_purchase_add_add() {
      const name = document.getElementById("p_purchase_add_f-name").value.trim();
      if (!name) { toastBanner("กรุณากรอกชื่อสิ่งของ", "error"); return; }
      const list = db("purchases");
      list.push({ id: nextId(list), name, detail: document.getElementById("p_purchase_add_f-detail").value.trim(), created_by: currentUserId(), created_at: "2026-07-23 " + new Date().toTimeString().slice(0,5) });
      dbSave("purchases", list);
      document.getElementById("p_purchase_add_f-name").value = ""; document.getElementById("p_purchase_add_f-detail").value = "";
      toastBanner("บันทึกรายการจัดซื้อสำเร็จ");
      p_purchase_add_render();
    }
</script>
</body>
</html>
