<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Bai+Jamjuree:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ['Sarabun', 'Thonburi', 'Bai Jamjuree', 'Inter', 'sans-serif'],
          heading: ['Sarabun', 'Thonburi', 'Space Grotesk', 'sans-serif'],
          mono: ['IBM Plex Mono', 'monospace'],
        }
      }
    }
  }
</script>
<style>
  html, body, button, input, select, textarea, div, p, span, h1, h2, h3, h4, h5, h6 {
    font-family: 'Sarabun', 'Thonburi', 'Bai Jamjuree', 'Inter', sans-serif !important;
  }
  .font-mono, code, pre { font-family: 'IBM Plex Mono', monospace !important; }
  .tab.active { border-bottom: 2px solid #2563eb; color: #2563eb; font-weight: 600; }
  html, body { margin: 0; height: 100%; }
</style>
<title>YuemDee · role-override-bulk</title>
</head>
<body class="bg-gray-50" onload="p_role_override_bulk_init()">

<div id="view-role-override-bulk" class="w-full h-full overflow-y-auto p-6">
<a href="javascript:void(0)" onclick="navigate('user-list')" class="text-sm text-blue-600 underline">← กลับรายชื่อผู้ใช้งาน</a>
  <h1 class="text-xl font-bold mt-2 mb-1">กำหนดบทบาทแบบกลุ่มผ่านไฟล์ CSV</h1>
  <p class="text-xs text-gray-500 mb-3">รูปแบบไฟล์: email,role (role = student หรือ staff)</p>
  <button onclick="p_role_override_bulk_downloadTemplate()" class="border px-3 py-1.5 text-sm mb-3">ดาวน์โหลด template.csv</button><br>
  <input id="p_role_override_bulk_file" type="file" accept=".csv" class="border px-2 py-1 text-sm mb-3">
  <button onclick="p_role_override_bulk_doImport()" class="bg-purple-600 text-white text-sm px-3 py-1.5 rounded">นำเข้า</button>
  <div id="p_role_override_bulk_result" class="mt-3 text-sm"></div>
</div>

<script src="../shared.js"></script>
<script>
function p_role_override_bulk_init() {
  notifyParentPage("role-override-bulk");
}

function p_role_override_bulk_downloadTemplate() {
      const csv = "email,role\ns005@ubu.ac.th,staff\ns006@ubu.ac.th,student\n";
      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "template_role_override.csv"; a.click();
    }
    function p_role_override_bulk_doImport() {
      const f = document.getElementById("p_role_override_bulk_file");
      if (!f.files.length) { toastBanner("กรุณาเลือกไฟล์ก่อน", "error"); return; }
      const reader = new FileReader();
      reader.onload = e => {
        const lines = e.target.result.split(/\r?\n/).filter(l => l.trim() !== "");
        lines.shift();
        const overrides = db("role_overrides");
        const errors = []; let ok = 0;
        lines.forEach((line, idx) => {
          const [email, role] = line.split(",").map(s => (s||"").trim());
          if (!email || !["student","staff"].includes(role)) { errors.push(`แถวที่ ${idx+2}: รูปแบบไม่ถูกต้อง (${line})`); return; }
          let ov = overrides.find(o => o.email === email);
          if (ov) { ov.role = role; ov.active = true; } else overrides.push({ email, role, reason: "นำเข้าแบบกลุ่ม", active: true });
          ok++;
        });
        dbSave("role_overrides", overrides);
        document.getElementById("p_role_override_bulk_result").innerHTML = `<p class="text-green-700">นำเข้าสำเร็จ ${ok} รายการ</p>` +
          (errors.length ? `<p class="text-red-600 mt-1">ผิดพลาด ${errors.length} แถว:</p><ul class="list-disc list-inside text-xs text-red-500">${errors.map(x=>`<li>${x}</li>`).join("")}</ul>` : "");
        toastBanner(`นำเข้าสำเร็จ ${ok} รายการ`);
      };
      reader.readAsText(f.files[0]);
    }
</script>
</body>
</html>
